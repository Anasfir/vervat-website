<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vervat Bouwadministratie Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dark werkplaats-sidebar left, light working surface right; tables and ledgers first, ochre marks what needs action */
:root{
  --bg:#eceef0; --surface:#ffffff; --ink:#18212b; --muted:#5d6874; --line:#d6dbe0; --soft:#f4f5f7;
  --accent:#c98a12; --accent-ink:#1c1406; --accent-soft:#f7ead0;
  --nav:#1a242e; --nav-ink:#c9d1d9; --nav-active:#26323e;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --warn:#a86a10; --warn-soft:#fbefd9; --bad:#b03e2c; --bad-soft:#f8e2de; --info:#2d5d8a; --info-soft:#e0eaf4;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --ink:#e4e8ec; --muted:#98a3ae; --line:#2b3540; --soft:#1f2832;
  --accent:#e2a63b; --accent-ink:#1c1406; --accent-soft:#3a2d14;
  --nav:#0c1116; --nav-ink:#aeb8c2; --nav-active:#1c2630;
  --ok:#5cbf83; --ok-soft:#173226; --warn:#e3a54a; --warn-soft:#382a12; --bad:#ee7a66; --bad-soft:#3d1d18; --info:#7fb0e0; --info-soft:#182b3d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e4e8ec; --muted:#98a3ae; --line:#2b3540; --soft:#1f2832;
  --accent:#e2a63b; --accent-ink:#1c1406; --accent-soft:#3a2d14;
  --nav:#0c1116; --nav-ink:#aeb8c2; --nav-active:#1c2630;
  --ok:#5cbf83; --ok-soft:#173226; --warn:#e3a54a; --warn-soft:#382a12; --bad:#ee7a66; --bad-soft:#3d1d18; --info:#7fb0e0; --info-soft:#182b3d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.nav{background:var(--nav);color:var(--nav-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--f-display)}
.brand b{font:700 17px var(--f-display);color:#fff;display:block;line-height:1.1}
.brand small{font-size:11px;opacity:.7}
.nav a{display:flex;justify-content:space-between;align-items:center;color:var(--nav-ink);text-decoration:none;padding:8px 10px;border-radius:5px;font-weight:500}
.nav a:hover{background:var(--nav-active);color:#fff}
.nav a.on{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{background:var(--bad);color:#fff;border-radius:9px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.nav .badge.neutral{background:#3a4652}
.nav .sep{height:1px;background:#2a3540;margin:10px 6px}
.conn{margin-top:auto;font-size:11.5px;padding:10px;border-radius:5px;background:#ffffff0d;display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:#888}
.dot.live{background:#5cbf83}.dot.local{background:#e2a63b}.dot.err{background:#ee7a66}

main{padding:28px 32px 60px;min-width:0;max-width:1320px;width:100%}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vhead .sub{color:var(--muted);margin:2px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:200px;max-width:380px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.icon{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:4px}
.icon:hover{color:var(--ink);background:var(--soft)}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical}
input[type=checkbox]{width:auto}
.toolbar select{width:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.card h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 a{font:500 12.5px var(--f-body);color:var(--info);text-decoration:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
.tile:hover{border-color:var(--muted)}
.tile .k{color:var(--muted);font-size:12.5px;font-weight:500}
.tile .v{font:700 24px var(--f-display);font-variant-numeric:tabular-nums;margin:2px 0}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.alert{box-shadow:inset 3px 0 0 var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:center;cursor:pointer}
.li:first-child{border-top:0}
.li:hover .t{text-decoration:underline}
.li .t{font-weight:500}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.empty .btn{margin-top:10px}
.empty.inline{padding:12px;border:0;background:none;text-align:left}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--accent-soft);color:var(--warn);font-weight:600;white-space:nowrap}
.bar{height:7px;background:var(--soft);border-radius:4px;overflow:hidden;border:1px solid var(--line);min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* planning */
.plan{display:grid;grid-template-columns:160px repeat(6,minmax(120px,1fr));min-width:900px}
.plan>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:64px}
.plan .ph{background:var(--soft);font-size:12px;font-weight:600;color:var(--muted);min-height:auto;padding:8px}
.plan .ph.today{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.plan .pm{font-weight:600;background:var(--soft)}
.plan .pm small{display:block;font-weight:400;color:var(--muted)}
.plan .cell{cursor:pointer;display:flex;flex-direction:column;gap:4px}
.plan .cell:hover{background:var(--soft)}
.plan .cell.we{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px)}
.chip{--h:200;background:hsl(var(--h) 55% 91%);color:hsl(var(--h) 55% 22%);border-radius:4px;padding:3px 6px;font-size:12px;line-height:1.3;border-left:3px solid hsl(var(--h) 50% 45%);cursor:pointer}
.chip small{display:block;opacity:.8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 86%)}}
:root[data-theme="dark"] .chip{background:hsl(var(--h) 30% 22%);color:hsl(var(--h) 60% 86%)}

/* modal */
.overlay{position:fixed;inset:0;background:#0b0f1499;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:20}
.dialog{background:var(--surface);border-radius:10px;width:100%;max-width:620px;box-shadow:0 20px 60px #0006;display:flex;flex-direction:column}
.dialog.wide{max-width:1040px}
.dialog>header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dbody{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.dialog>footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 10px 10px;flex-wrap:wrap}
.grow{flex:1}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.form.two{grid-template-columns:repeat(2,1fr)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12.5px;font-weight:500;color:var(--muted)}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--f-body);font-weight:600}
table.regels td{padding:5px 6px;vertical-align:middle}
table.regels input,table.regels select{padding:5px 7px}
table.regels .w-desc{min-width:240px}
table.regels .w-num input{width:90px;text-align:right}
.tot-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.totals{min-width:280px;display:grid;grid-template-columns:1fr auto;gap:3px 18px;font-variant-numeric:tabular-nums}
.totals .big{font:700 17px var(--f-display);border-top:1px solid var(--line);padding-top:5px}
.note{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:6px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}

/* paper preview */
.paper{background:#fff;color:#1b1b1b;padding:40px 44px;border:1px solid #ddd;border-radius:4px;font-size:13px;max-width:800px;margin:0 auto;width:100%}
.paper table th{background:#f3f3f3;color:#555}
.paper td,.paper th{border-color:#e2e2e2}
.p-head{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #c98a12;padding-bottom:14px;margin-bottom:20px}
.p-brand{font:700 22px var(--f-display)}
.p-title{font:700 26px var(--f-display);text-align:right}
.p-small{font:400 12px/1.5 var(--f-body);color:#666}
.p-meta{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.p-meta dl{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:0}
.p-meta dt{color:#666}.p-meta dd{margin:0;text-align:right}
.p-label{color:#666;font-size:12px}
.p-tot{display:flex;justify-content:flex-end;margin-top:12px}
.p-tot .totals{color:#1b1b1b}
.p-foot{margin-top:26px;padding-top:12px;border-top:1px solid #e2e2e2;font-size:11.5px;color:#666}

/* chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding:10px 0 0;border-bottom:1px solid var(--line)}
.chart .m{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%;position:relative}
.chart .m i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.chart .m i.k{background:var(--muted);opacity:.55}
.chart-l{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-top:4px}
.chart-l span{flex:1;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:40;max-width:min(380px,calc(100vw - 36px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:6px;box-shadow:0 6px 20px #0004;font-size:13.5px}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .nav{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px;z-index:10}
  .brand{padding:0 8px 0 4px}.brand small,.nav .sep,.conn{display:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  main{padding:18px 16px 60px}
  .form{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.form,.form.two{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.paper{padding:22px 18px}}
</style>
</head>

<div class="app">
  <nav class="nav" id="nav" aria-label="Hoofdmenu"></nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="preview-root"></div>
<div id="toasts" role="status" aria-live="polite"></div>

async function save(c,obj){
  if(!obj.id) obj.id = newId();
  const {id,...body} = obj;
  body.gewijzigd = new Date().toISOString();
  S[c][id] = {...body,id};
  scheduleRender();
  if(db && !readOnly){
    try{ await db.collection(c).doc(id).set(JSON.parse(JSON.stringify(body))); }
    catch(e){ dbError(e); }
  }
  return id;
}
async function remove(c,id){
  delete S[c][id]; scheduleRender();
  if(db && !readOnly){ try{ await db.collection(c).doc(id).delete(); }catch(e){ dbError(e); } }
}
function dbError(e){
  const code = e && e.code;
  if(code==='invalid_argument'){ readOnly = true; toast('Je hebt alleen leesrechten. Vraag de eigenaar om je als bijdrager toe te voegen; wijzigingen worden nu niet opgeslagen.','bad'); }
  else if(code==='quota_exceeded'){ toast('De database is vol ('+(e.message||'')+'). Verwijder oude gegevens om verder te gaan.','bad'); }
  else if(code==='resource_exhausted'){ toast('Te veel wijzigingen tegelijk. Wacht even en probeer het opnieuw.','bad'); }
  else { toast('Opslaan mislukt. Controleer je verbinding en probeer het opnieuw.','bad'); }
  scheduleRender();
}

async function init(){
  Object.keys(DEMO).forEach(c=>{ S[c]={}; Object.entries(DEMO[c]).forEach(([id,o])=>S[c][id]={...o,id}); }); mode='demo'; route(); render(); return;
  route(); render();
  loadTimer = setTimeout(()=>{ if(mode==='loading'){ mode = db ? 'slow' : 'local'; scheduleRender(); } }, 10000);
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  if(!db){ mode='local'; clearTimeout(loadTimer); scheduleRender(); return; }
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const m = {}; snap.docs.forEach(d=>{ m[d.id] = {...d.data(), id:d.id}; });
      S[c] = m;
      if(!snap.metadata.fromCache) loaded.add(c);
      if(loaded.size===COLS.length && mode!=='live'){ mode='live'; clearTimeout(loadTimer); }
      scheduleRender();
    }, ()=>{ mode='error'; clearTimeout(loadTimer); scheduleRender(); });
  });
}

/* ---------- domain calculations ---------- */
function totals(regels=[], verlegd=false){
  let excl=0; const btw={}, base={};
  (regels||[]).forEach(r=>{ const b=(+r.aantal||0)*(+r.prijs||0); excl+=b; const p=verlegd?0:(+r.btw||0); base[p]=(base[p]||0)+b; if(p) btw[p]=(btw[p]||0)+b*p/100; });
  Object.keys(btw).forEach(k=>btw[k]=r2(btw[k]));
  excl = r2(excl);
  const btwTot = r2(sum(Object.values(btw),x=>x));
  return {excl, btw, base, btwTot, incl:r2(excl+btwTot)};
}
const factStatus = f => f.status==='verzonden' && f.vervaldatum && f.vervaldatum < today() ? 'vervallen' : (f.status||'concept');

const isOpen = f => f.status==='verzonden';
const isBooked = f => f.status && f.status!=='concept';
function nextNr(col, prefix, pad){
  const pre = `${prefix}${new Date().getFullYear()}-`; let max=0;
  all(col).forEach(x=>{ if(x.nummer && String(x.nummer).startsWith(pre)){ const n=parseInt(String(x.nummer).slice(pre.length),10); if(n>max) max=n; } });
  return pre + String(max+1).padStart(pad,'0');
}
function projStats(p){
  const uren = all('uren').filter(u=>u.projectId===p.id);
  const urenTot = sum(uren,'uren');
  const loon = sum(uren,u=>(+u.uren||0)*(+(byId('medewerkers',u.medewerkerId)||{}).kostprijs||0));
  const inkoop = sum(all('boekingen').filter(b=>b.projectId===p.id && b.type==='uitgave'),'bedrag');
  const kosten = r2(loon+inkoop);
  const gefact = sum(all('facturen').filter(f=>f.projectId===p.id && isBooked(f)), f=>totals(f.regels,f.btwVerlegd).excl);
  const ongefactUren = sum(uren.filter(u=>!u.factuurId),'uren');
  const budget = +p.budget||0;
  return {urenTot, loon, inkoop, kosten, gefact, budget, ongefactUren, pct: budget? kosten/budget : 0};
}

const checked = id => { const el=document.getElementById(id); return !!(el && el.checked); };
const head = (title, sub, actions='') => `<div class="vhead"><div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div><div class="actions">${actions}</div></div>`;
const toolbar = html => `<div class="toolbar">${html}</div>`;
const emptyBox = (msg, act, label) => `<div class="empty">${msg}${act?`<div><button class="btn primary" data-act="${act}">${label}</button></div>`:''}</div>`;
const rowAttrs = (act,id) => `class="click" tabindex="0" data-act="${act}" data-id="${esc(id)}"`;
function table(cols, rows, opts={}){
  if(!rows.length) return opts.empty || `<div class="empty">Nog niets hier.</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.cls||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${r.attrs||''}>${r.cells.map((c,i)=>`<td class="${cols[i].cls||''}">${c}</td>`).join('')}</tr>`).join('')}</tbody>${opts.foot?`<tfoot><tr>${opts.foot}</tr></tfoot>`:''}</table></div>`;
}
function toast(msg, kind=''){
  const el=document.createElement('div'); el.className='toast '+kind; el.textContent=msg; $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(), kind==='bad'?6500:3200);
}
function armed(el){
  if(el.classList.contains('armed')) return true;
  const t=el.textContent; el.classList.add('armed'); el.textContent='Klik nogmaals om te bevestigen';
  setTimeout(()=>{ el.classList.remove('armed'); el.textContent=t; },3500);
  return false;
}
function copyCSV(rows, what){
  const csv = rows.map(r=>r.map(c=>{ let s = typeof c==='number' ? c.toFixed(2).replace('.',',') : String(c??''); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\n');
  navigator.clipboard.writeText(csv).then(()=>toast(what+' gekopieerd. Plak het in Excel of stuur het naar je boekhouder.','ok'), ()=>toast('Kopiëren werd door de browser geweigerd.','bad'));
}

/* ---------- modal ---------- */
let M = null;
function modal(title, body, opts={}){
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="dialog ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon" data-act="closeModal" aria-label="Sluiten">×</button></header><div class="dbody">${body}</div>${opts.foot?`<footer>${opts.foot}</footer>`:''}</div></div>`;
  M = opts;
  setTimeout(()=>{ const f=document.querySelector('#modal-root .dbody input:not([type=checkbox]), #modal-root .dbody select'); if(f) f.focus(); },0);
}
function closeModal(){ $('#modal-root').innerHTML=''; M=null; }
function preview(title, html){
  $('#preview-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="dialog wide" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon" data-act="closePreview" aria-label="Sluiten">×</button></header><div class="dbody" style="background:var(--soft)">${html}</div><footer><span class="muted grow">Voorbeeld zoals je klant het ziet. Sla de offerte of factuur op om wijzigingen te bewaren.</span><button class="btn" data-act="closePreview">Terug naar bewerken</button></footer></div></div>`;
}

/* ---------- regels editor (offerte / factuur / werkbon) ---------- */
const newRegel = (soort='Arbeid') => ({soort, omschrijving:'', aantal:1, eenheid: soort==='Arbeid'?'uur':'st', prijs:0, btw:21});
function regelsEditor(regels, kind){
  const doc = kind!=='mat';
  const rows = regels.map((r,i)=>`<tr>
    ${doc?`<td>${sel('r'+i+'s',SOORTEN,r.soort,`data-r="${i}" data-k="soort" aria-label="Soort"`)}</td>`:''}
    <td class="w-desc"><input id="r${i}o" data-r="${i}" data-k="omschrijving" value="${esc(r.omschrijving)}" aria-label="Omschrijving" placeholder="Omschrijving"></td>
    <td class="w-num"><input id="r${i}a" type="number" step="any" data-r="${i}" data-k="aantal" value="${esc(r.aantal)}" aria-label="Aantal"></td>
    <td>${sel('r'+i+'e',UNITS,r.eenheid,`data-r="${i}" data-k="eenheid" aria-label="Eenheid"`)}</td>
    <td class="w-num"><input id="r${i}p" type="number" step="0.01" data-r="${i}" data-k="prijs" value="${esc(r.prijs)}" aria-label="Prijs per eenheid"></td>
    ${doc?`<td>${sel('r'+i+'b',BTW,r.btw,`data-r="${i}" data-k="btw" aria-label="Btw-tarief"`)}</td>`:''}
    <td class="num" id="rt${i}">${fmt((+r.aantal||0)*(+r.prijs||0))}</td>
    <td><button class="icon" data-act="delRegel" data-i="${i}" aria-label="Regel verwijderen">×</button></td></tr>`).join('');
  return `<div class="tbl-wrap"><table class="regels"><thead><tr>${doc?'<th>Soort</th>':''}<th>Omschrijving</th><th class="num">Aantal</th><th>Eenheid</th><th class="num">Prijs</th>${doc?'<th>Btw</th>':''}<th class="num">Totaal</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="8" class="muted">Nog geen regels.</td></tr>`}</tbody></table></div>
  <div class="actions"><button class="btn ghost sm" data-act="addRegel" data-s="Arbeid">+ ${doc?'Arbeid':'Materiaal'}</button>${doc?`<button class="btn ghost sm" data-act="addRegel" data-s="Materiaal">+ Materiaal</button><button class="btn ghost sm" data-act="addRegel" data-s="Onderaanneming">+ Onderaanneming</button>`:''}</div>`;
}
function totalsHtml(t, verlegd){
  let h = `<span>Subtotaal excl. btw</span><span class="num">${fmt(t.excl)}</span>`;
  if(verlegd) h += `<span>Btw verlegd</span><span class="num">${fmt(0)}</span>`;
  else Object.keys(t.btw).sort((a,b)=>b-a).forEach(p=>{ h += `<span>Btw ${p}% over ${fmt(t.base[p])}</span><span class="num">${fmt(t.btw[p])}</span>`; });
  return h + `<span class="big">Totaal</span><span class="big num">${fmt(t.incl)}</span>`;
}
function updateTotals(){
  const el=$('#totals'); if(!el||!M||!M.draft) return;
  const regels = M.draft[M.regelKey];
  if(M.kind==='werkbon'){ el.innerHTML = `<span class="big">Materialen excl. btw</span><span class="big num">${fmt(totals(regels).excl)}</span>`; return; }
  el.innerHTML = totalsHtml(totals(regels, checked('fVerlegd')), checked('fVerlegd'));
}
function rerenderRegels(){ $('#regels').innerHTML = regelsEditor(M.draft[M.regelKey], M.kind==='werkbon'?'mat':'doc'); updateTotals(); }

};
let view = 'dashboard';
function route(){ const h=location.hash.slice(1); view = VIEWS[h] ? h : 'dashboard'; }

function renderNav(){
  const vervallen = all('facturen').filter(f=>factStatus(f)==='vervallen').length;
  const wachten = all('offertes').filter(o=>o.status==='verzonden').length;
  const badge = {facturen: vervallen?`<span class="badge" title="Vervallen facturen">${vervallen}</span>`:'', offertes: wachten?`<span class="badge neutral" title="Offertes wachten op reactie">${wachten}</span>`:''};
  const conn = {live:['live','Opgeslagen in de gedeelde database. Je team ziet wijzigingen direct.'], loading:['','Gegevens laden…'], slow:['err','De database is nog niet bereikbaar. Wat je ziet kan verouderd zijn.'], local:['local','Losse weergave: wijzigingen worden niet bewaard. Open de app via claude.ai om op te slaan.'], demo:['local','Demoversie met voorbeeldgegevens. Probeer gerust alles: wijzigingen verdwijnen bij herladen.'], error:['err','Verbinding met de database verbroken. Herlaad de pagina.']}[mode];
  $('#nav').innerHTML = `<div class="brand"><div class="mark">V</div><div><b>${esc(bedrijf().naam)}</b><small>Bouwadministratie</small></div></div>
    ${Object.entries(VIEWS).map(([k,v],i)=>`${i===7?'<div class="sep"></div>':''}<a href="#${k}" class="${view===k?'on':''}" ${view===k?'aria-current="page"':''}><span>${v.t}</span>${badge[k]||''}</a>`).join('')}
    <div class="conn"><span class="dot ${conn[0]}"></span><span>${readOnly?'Alleen lezen. Wijzigingen worden niet opgeslagen.':conn[1]}</span></div>`;
}
let rq=false;
function scheduleRender(){ if(rq) return; rq=true; requestAnimationFrame(()=>{ rq=false; render(); }); }
function render(){
  const ae=document.activeElement, fid = ae && ae.id && ae.closest && ae.closest('#main') ? ae.id : null;
  let s=null; try{ s = fid ? ae.selectionStart : null; }catch(e){}
  renderNav();
  $('#main').innerHTML = VIEWS[view].f();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(s!=null) el.setSelectionRange(s,s); }catch(e){} } }
}

/* Dashboard */
function vDashboard(){
  const t=today(), wk=mondayOf(t), wkEnd=addDays(wk,6), y=String(new Date().getFullYear());
  const offOpen = all('offertes').filter(o=>o.status==='verzonden');
  const offVal = sum(offOpen,o=>totals(o.regels,o.btwVerlegd).excl);
  const projAct = all('projecten').filter(p=>p.status==='in uitvoering');
  const urenWk = sum(all('uren').filter(u=>u.datum>=wk&&u.datum<=wkEnd),'uren');
  const open = all('facturen').filter(isOpen), verv = open.filter(f=>factStatus(f)==='vervallen');
  const openVal = sum(open,f=>totals(f.regels,f.btwVerlegd).incl);
  const omzet = sum(all('facturen').filter(f=>isBooked(f)&&String(f.datum).startsWith(y)),f=>totals(f.regels,f.btwVerlegd).excl);
  const vandaag = all('planning').filter(p=>p.datum===t);
  const hasExample = mode==='demo';
  const progress = all('projecten').filter(p=>p.status==='in uitvoering'||p.status==='gepland').map(p=>({p,s:projStats(p)})).sort((a,b)=>b.s.pct-a.s.pct);

  const li = (act,id,title,sub,right) => `<div class="li" data-act="${act}" data-id="${esc(id)}" tabindex="0"><div><div class="t">${title}</div><div class="muted">${sub}</div></div><div class="num">${right}</div></div>`;
  const hr=new Date().getHours();
  return head(hr<12?'Goedemorgen':hr<18?'Goedemiddag':'Goedenavond', `${new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})} · week ${isoWeek(t)}`,
      `<button class="btn" data-act="editUren">Uren schrijven</button><button class="btn primary" data-act="editOfferte">+ Nieuwe offerte</button>`)
  + (hasExample?`<div class="banner"><span>Dit is een <strong>demoversie</strong> met voorbeeldgegevens. Klik gerust overal doorheen; niets wordt opgeslagen.</span></div>`:'')
  + `<div class="tiles">
      <a class="tile" href="#offertes"><div class="k">Offertes in afwachting</div><div class="v">${fmt(offVal)}</div><div class="s">${offOpen.length} offerte${offOpen.length===1?'':'s'} verzonden</div></a>
      <a class="tile" href="#projecten"><div class="k">Projecten in uitvoering</div><div class="v">${projAct.length}</div><div class="s">${all('projecten').filter(p=>p.status==='gepland').length} gepland</div></a>
      <a class="tile" href="#uren"><div class="k">Uren deze week</div><div class="v">${fnum(urenWk)}</div><div class="s">${all('medewerkers').filter(m=>m.actief!==false).length} actieve medewerkers</div></a>
      <a class="tile ${verv.length?'alert':''}" href="#facturen"><div class="k">Openstaande facturen</div><div class="v">${fmt(openVal)}</div><div class="s">${verv.length?`<span style="color:var(--bad);font-weight:600">${verv.length} vervallen</span>`:'Niets vervallen'}</div></a>
      <a class="tile" href="#boekhouding"><div class="k">Omzet ${y} (excl. btw)</div><div class="v">${fmt(omzet)}</div><div class="s">Gefactureerd dit jaar</div></a>
    </div>
    <div class="grid2">
      <div class="card"><h3>Vandaag ingepland <a href="#planning">Planning →</a></h3><div class="list">${vandaag.length? vandaag.map(p=>li('editPlan',p.id,esc(mwName(p.medewerkerId)),esc(projName(p.projectId))+(p.notitie?' · '+esc(p.notitie):''),esc(p.dagdeel||'hele dag'))).join('') : `<div class="empty inline">Niemand ingepland voor vandaag.</div>`}</div></div>
      <div class="card"><h3>Vervallen facturen <a href="#facturen">Facturen →</a></h3><div class="list">${verv.length? verv.sort((a,b)=>a.vervaldatum.localeCompare(b.vervaldatum)).map(f=>li('editFactuur',f.id,esc(f.nummer)+' · '+esc(relName(f.relatieId)),`${daysBetween(f.vervaldatum,t)} dagen over de vervaldatum`,fmt(totals(f.regels,f.btwVerlegd).incl))).join('') : `<div class="empty inline">Alle verzonden facturen zijn binnen de betaaltermijn.</div>`}</div></div>
      <div class="card"><h3>Offertes wachten op reactie <a href="#offertes">Offertes →</a></h3><div class="list">${offOpen.length? offOpen.sort((a,b)=>a.datum.localeCompare(b.datum)).map(o=>li('editOfferte',o.id,esc(o.nummer)+' · '+esc(relName(o.relatieId)),`${esc(o.titel||'')} · ${daysBetween(o.datum,t)} dagen geleden verstuurd${offStatus(o)==='verlopen'?' · <span style="color:var(--warn)">verlopen</span>':''}`,fmt(totals(o.regels,o.btwVerlegd).excl))).join('') : `<div class="empty inline">Geen openstaande offertes.</div>`}</div></div>
      <div class="card"><h3>Kosten ten opzichte van budget <a href="#projecten">Projecten →</a></h3><div class="list">${progress.length? progress.map(({p,s})=>`<div class="li" data-act="openProject" data-id="${p.id}" tabindex="0"><div style="flex:1"><div class="t">${esc(p.naam)}</div><div class="muted">${fmt(s.kosten)} van ${s.budget?fmt(s.budget):'geen budget'} · ${fnum(s.urenTot)} uur</div></div><div style="width:120px">${progressBar(s)}</div></div>`).join('') : `<div class="empty inline">Geen lopende projecten.</div>`}</div></div>
    </div>`;
}
function progressBar(s){ const pct=Math.min(1,s.pct)*100; const c = s.pct>1?'bad':s.pct>.85?'warn':''; return `<div class="bar ${c}" title="${Math.round(s.pct*100)}% van budget"><i style="width:${pct}%"></i></div><div class="muted num" style="text-align:right">${s.budget?Math.round(s.pct*100)+'%':'—'}</div>`; }

/* Relaties */
function vRelaties(){

    const open = sum(all('facturen').filter(x=>x.relatieId===r.id&&isOpen(x)),x=>totals(x.regels,x.btwVerlegd).incl);
    const np = all('projecten').filter(p=>p.relatieId===r.id).length;

}
function editRel(id){

    const off=all('offertes').filter(o=>o.relatieId===id), pr=all('projecten').filter(p=>p.relatieId===id), fa=all('facturen').filter(f=>f.relatieId===id);
    const open = sum(fa.filter(isOpen),f=>totals(f.regels,f.btwVerlegd).incl), omz = sum(fa.filter(isBooked),f=>totals(f.regels,f.btwVerlegd).excl);

  }
  modal(id?r.naam:'Nieuwe relatie', linked+`<div class="form">
    ${fld('Naam / bedrijfsnaam','fNaam',inp('fNaam',r.naam),'span2')}
    ${fld('Type','fType',sel('fType',REL_TYPES,r.type))}
    ${fld('Contactpersoon','fCp',inp('fCp',r.contactpersoon))}
    ${fld('Telefoon','fTel',inp('fTel',r.telefoon,'tel'))}
    ${fld('E-mail','fMail',inp('fMail',r.email,'email'))}
    ${fld('Adres','fAdres',inp('fAdres',r.adres))}
    ${fld('Postcode','fPc',inp('fPc',r.postcode))}
    ${fld('Plaats','fPlaats',inp('fPlaats',r.plaats))}
    ${fld('KvK-nummer','fKvk',inp('fKvk',r.kvk))}

/* Planning */
function vPlanning(){
  const wk=ui.week, days=[0,1,2,3,4,5].map(i=>addDays(wk,i)), t=today();
  const mws = all('medewerkers').filter(m=>m.actief!==false).sort(byName);
  const items = all('planning').filter(p=>p.datum>=days[0]&&p.datum<=days[5]);
  const label = `${new Date(days[0]+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'})} – ${new Date(days[5]+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'})}`;
  const nav = `<button class="btn" data-act="week" data-d="-7" aria-label="Vorige week">‹</button><button class="btn" data-act="week" data-d="0">Deze week</button><button class="btn" data-act="week" data-d="7" aria-label="Volgende week">›</button>`;
  if(!mws.length) return head('Planning', `Week ${isoWeek(wk)} · ${label}`, nav) + emptyBox('Voeg eerst medewerkers toe om ze in te plannen.','editMw','+ Medewerker toevoegen');
  const hdr = `<div class="ph">Medewerker</div>`+days.map(d=>`<div class="ph ${d===t?'today':''}">${fday(d)}</div>`).join('');
  const body = mws.map(m=>{
    const cells = days.map((d,i)=>{ const its=items.filter(p=>p.medewerkerId===m.id&&p.datum===d);
      return `<div class="cell ${i===5?'we':''}" data-act="addPlan" data-d="${d}" data-m="${m.id}" title="Klik om in te plannen">${its.map(p=>`<div class="chip" style="--h:${hue(p.projectId)}" data-act="editPlan" data-id="${p.id}">${esc(projName(p.projectId))}<small>${esc(p.dagdeel&&p.dagdeel!=='hele dag'?p.dagdeel:'')}${p.notitie?(p.dagdeel&&p.dagdeel!=='hele dag'?' · ':'')+esc(p.notitie):''}</small></div>`).join('')}</div>`; }).join('');
    const ingepland = items.filter(p=>p.medewerkerId===m.id).reduce((s,p)=>s+(p.dagdeel&&p.dagdeel!=='hele dag'?.5:1),0);
    return `<div class="pm">${esc(m.naam)}<small>${esc(m.functie||'')} · ${fnum(ingepland)} dag${ingepland===1?'':'en'}</small></div>${cells}`;
  }).join('');
  return head('Planning', `Week ${isoWeek(wk)} · ${label} · ${items.length} inplanningen`, nav+`<button class="btn" data-act="copyWeek">Kopieer vorige week</button>`)
    + `<div class="tbl-wrap"><div class="plan">${hdr}${body}</div></div><p class="muted">Klik op een vak om iemand in te plannen, of op een blok om het te wijzigen.</p>`;
}

function factuurUitProject(pid){
  const p=byId('projecten',pid), b=bedrijf(); if(!p) return;
  const uren=all('uren').filter(u=>u.projectId===pid && !u.factuurId);
  const groups={};
  uren.forEach(u=>{ const m=byId('medewerkers',u.medewerkerId)||{}; const tarief=+m.tarief||+b.uurtarief||0; const k=(m.id||'x')+'|'+tarief+'|'+(u.soort==='meerwerk'?'m':''); (groups[k] ||= {naam:m.naam||'Medewerker', tarief, uren:0, meer:u.soort==='meerwerk'}).uren += +u.uren||0; });
  const regels = Object.values(groups).map(g=>({soort:'Arbeid', omschrijving:`${g.meer?'Meerwerk – arbeid':'Arbeid'} ${g.naam}`, aantal:r2(g.uren), eenheid:'uur', prijs:g.tarief, btw:21}));
  const wbs=all('werkbonnen').filter(w=>w.projectId===pid && w.status!=='gefactureerd');
  wbs.forEach(w=>(w.materialen||[]).forEach(m=>regels.push({soort:'Materiaal', omschrijving:`${m.omschrijving} (werkbon ${w.nummer})`, aantal:m.aantal, eenheid:m.eenheid, prijs:m.prijs, btw:21})));
  if(!regels.length){ toast('Er zijn geen ongefactureerde uren of werkbonnen voor dit project.'); return; }
  const rel=byId('relaties',p.relatieId)||{};
  editFactuur(null, {relatieId:p.relatieId, projectId:pid, titel:`${p.naam} – uren en materiaal t/m ${fdate(today())}`, regels, btwVerlegd:!!rel.btwVerlegd, _urenIds:uren.map(u=>u.id), _wbIds:wbs.map(w=>w.id)});
}

/* Boekhouding */
function inYear(d,y){ return String(d||'').startsWith(String(y)); }
function inQ(d,y,q){ if(!inYear(d,y)) return false; const m=+String(d).slice(5,7); return Math.floor((m-1)/3)+1===q; }
function btwAangifte(y,q){
  const r={ '1a':[0,0], '1b':[0,0], '1e':[0,0], '2a':[0,0], '5b':0 };
  const add=(regels,verlegd)=>{ (regels||[]).forEach(x=>{ const b=(+x.aantal||0)*(+x.prijs||0); const p=+x.btw||0; if(verlegd||p===0){ r['1e'][0]+=b; } else if(p===21){ r['1a'][0]+=b; r['1a'][1]+=b*.21; } else if(p===9){ r['1b'][0]+=b; r['1b'][1]+=b*.09; } }); };
  all('facturen').filter(f=>isBooked(f)&&inQ(f.datum,y,q)).forEach(f=>add(f.regels,f.btwVerlegd));
  all('boekingen').filter(b=>inQ(b.datum,y,q)).forEach(b=>{
    const base=+b.bedrag||0, p=+b.btw||0;
    if(b.type==='inkomst'){ add([{aantal:1,prijs:base,btw:p}],false); return; }
    if(b.btwVerlegd){ r['2a'][0]+=base; r['2a'][1]+=base*.21; r['5b']+=base*.21; }
    else r['5b']+=base*p/100;
  });
  const a5 = r['1a'][1]+r['1b'][1]+r['2a'][1];
  return {...r, '5a':a5, saldo:a5-r['5b']};
}

  modal(id?m.naam:'Nieuwe medewerker', `<div class="form two">
    ${fld('Naam','fNaam',inp('fNaam',m.naam))}${fld('Functie','fFunctie',inp('fFunctie',m.functie,'text','placeholder="bijv. timmerman, uitvoerder"'))}
    ${fld('Verkooptarief per uur','fTarief',inp('fTarief',m.tarief,'number'))}${fld('Kostprijs per uur','fKost',inp('fKost',m.kostprijs,'number'))}
    ${fld('Telefoon','fTel',inp('fTel',m.telefoon,'tel'))}<div class="fld" style="justify-content:flex-end">${chk('fActief','Actief (zichtbaar in planning)',m.actief!==false)}</div>
  </div>`, {id, foot:`${id?'<button class="btn danger ghost" data-act="delMw">Verwijderen</button>':''}<span class="grow"></span><button class="btn ghost" data-act="closeModal">Annuleren</button><button class="btn primary" data-act="saveMw">Opslaan</button>`});
}

/* ---------- actions ---------- */
const A = {
  overlay:(d,el,e)=>{ if(e.target===el){ if(el.closest('#preview-root')) $('#preview-root').innerHTML=''; else closeModal(); } },
  closeModal:()=>closeModal(),
  closePreview:()=>{ $('#preview-root').innerHTML=''; },
  addRegel:d=>{ M.draft[M.regelKey].push(M.kind==='werkbon'?{omschrijving:'',aantal:1,eenheid:'st',prijs:0}:newRegel(d.s)); rerenderRegels(); const i=M.draft[M.regelKey].length-1; const el=document.getElementById('r'+i+'o'); if(el) el.focus(); },
  delRegel:d=>{ M.draft[M.regelKey].splice(+d.i,1); rerenderRegels(); },
  previewDoc:()=>{ const d = M.kind==='factuur'?collectFactuur():collectOfferte(); preview((M.kind==='factuur'?'Factuur ':'Offerte ')+d.nummer, docPreview(d,M.kind)); },

  editRel:d=>editRel(d.id),
  saveRel:async()=>{ if(!val('fNaam')){ toast('Vul een naam in.','bad'); return; }
    const r = Object.assign(M.id?clone(S.relaties[M.id]):{}, {id:M.id, naam:val('fNaam'),type:val('fType'),contactpersoon:val('fCp'),telefoon:val('fTel'),email:val('fMail'),adres:val('fAdres'),postcode:val('fPc'),plaats:val('fPlaats'),kvk:val('fKvk'),btwNummer:val('fBtwnr'),btwVerlegd:checked('fRelVerlegd'),notities:val('fNot')});
    closeModal(); await save('relaties',r); toast('Relatie opgeslagen.','ok'); },
  delRel:async(d,el)=>{ const used=['offertes','projecten','facturen'].some(c=>all(c).some(x=>x.relatieId===M.id)); if(used){ toast('Deze relatie heeft offertes, projecten of facturen en kan niet worden verwijderd.','bad'); return; } if(!armed(el)) return; const id=M.id; closeModal(); await remove('relaties',id); toast('Relatie verwijderd.'); },

  editOfferte:d=>editOfferte(d.id),
  saveOfferte:async()=>{ const o=collectOfferte(); if(!o.relatieId){ toast('Kies een relatie voor de offerte.','bad'); return; } closeModal(); await save('offertes',o); toast('Offerte '+o.nummer+' opgeslagen.','ok'); },
  delOfferte:async(d,el)=>{ if(!armed(el)) return; const id=M.id; closeModal(); await remove('offertes',id); toast('Offerte verwijderd.'); },
  offerteToProject:async()=>{ const o=collectOfferte(); if(!o.relatieId){ toast('Kies eerst een relatie.','bad'); return; }
    o.status='geaccepteerd'; if(!o.id) o.id=newId();
    const p={id:newId(), nummer:nextNr('projecten','PR-',3), naam:o.titel||('Project '+relName(o.relatieId)), relatieId:o.relatieId, offerteId:o.id, adres:o.adres, budget:totals(o.regels,o.btwVerlegd).excl, status:'gepland', startdatum:today(), omschrijving:o.inleiding};
    o.projectId=p.id; closeModal(); await save('offertes',o); await save('projecten',p); toast('Offerte geaccepteerd en project '+p.nummer+' aangemaakt.','ok'); go('projecten'); editProject(p.id); },
  offerteToFactuur:async()=>{ const o=collectOfferte(); if(!o.relatieId){ toast('Kies eerst een relatie.','bad'); return; } closeModal(); await save('offertes',o);
    go('facturen'); editFactuur(null,{relatieId:o.relatieId, projectId:o.projectId||'', offerteId:o.id, titel:o.titel, regels:clone(o.regels), btwVerlegd:o.btwVerlegd}); },

  editProject:d=>editProject(d.id),
  openProject:d=>editProject(d.id),
  saveProject:async()=>{ if(!val('fNaam')){ toast('Vul een projectnaam in.','bad'); return; }
    const p=Object.assign(M.id?clone(S.projecten[M.id]):{}, {id:M.id, naam:val('fNaam'),nummer:val('fNr'),relatieId:val('fRel'),status:val('fStatus'),adres:val('fWerk'),budget:valn('fBudget'),startdatum:val('fStart'),einddatum:val('fEind'),offerteId:val('fOff'),omschrijving:val('fOms')});
    closeModal(); await save('projecten',p); toast('Project opgeslagen.','ok'); },
  delProject:async(d,el)=>{ const used=['uren','facturen','werkbonnen'].some(c=>all(c).some(x=>x.projectId===M.id)); if(used){ toast('Dit project heeft uren, werkbonnen of facturen. Zet de status op "afgerond" in plaats van verwijderen.','bad'); return; } if(!armed(el)) return; const id=M.id; closeModal(); await remove('projecten',id); all('planning').filter(p=>p.projectId===id).forEach(p=>remove('planning',p.id)); toast('Project verwijderd.'); },
  factuurUitProject:d=>{ closeModal(); go('facturen'); factuurUitProject(d.id); },
  pickProjectFactuur:()=>{ const ps=all('projecten').filter(p=>p.status!=='afgerond').map(p=>({p,s:projStats(p)})).filter(x=>x.s.ongefactUren>0||all('werkbonnen').some(w=>w.projectId===x.p.id&&w.status!=='gefactureerd'));
    modal('Factuur uit project', ps.length? `<p class="muted">Kies een project. Alle nog niet gefactureerde uren (tegen het verkooptarief van de medewerker) en materialen van werkbonnen komen op de factuur.</p><div class="list">${ps.map(({p,s})=>`<div class="li" data-act="factuurUitProject" data-id="${p.id}" tabindex="0"><div><div class="t">${esc(p.naam)}</div><div class="muted">${esc(relName(p.relatieId))}</div></div><div class="num">${fnum(s.ongefactUren)} uur open</div></div>`).join('')}</div>` : `<div class="empty inline">Er zijn geen projecten met ongefactureerde uren of werkbonnen.</div>`); },

  week:d=>{ ui.week = +d.d===0 ? mondayOf(today()) : addDays(ui.week,+d.d); render(); },
  addPlan:d=>editPlan(null,{datum:d.d, medewerkerId:d.m}),
  editPlan:d=>editPlan(d.id),
  savePlan:async()=>{ if(!val('fMw')||!val('fProj')){ toast('Kies een medewerker en een project.','bad'); return; }
    const base={datum:val('fDatum'),dagdeel:val('fDeel'),medewerkerId:val('fMw'),projectId:val('fProj'),notitie:val('fNot')};
    const p=Object.assign(M.id?clone(S.planning[M.id]):{}, base, {id:M.id}); const week=!M.id&&checked('fHeleWeek'); closeModal(); await save('planning',p);
    if(week){ let d=base.datum; while(true){ d=addDays(d,1); const wd=new Date(d+'T12:00:00').getDay(); if(wd===6||wd===0) break; await save('planning',{...base,datum:d}); } }
    toast('Ingepland.','ok'); },
  delPlan:async()=>{ const id=M.id; closeModal(); await remove('planning',id); toast('Inplanning verwijderd.'); },
  copyWeek:async(d,el)=>{ const prev=addDays(ui.week,-7), src=all('planning').filter(p=>p.datum>=prev&&p.datum<=addDays(prev,6)); if(!src.length){ toast('Vorige week is leeg.'); return; } if(all('planning').some(p=>p.datum>=ui.week&&p.datum<=addDays(ui.week,6)) && !armed(el)) return;
    for(const p of src){ const {id,gewijzigd,voorbeeld,...rest}=p; await save('planning',{...rest,datum:addDays(p.datum,7)}); } toast(src.length+' inplanningen gekopieerd.','ok'); },

  urenTab:d=>{ ui.urenTab=d.t; render(); },
  editUren:d=>editUren(d.id, d.p?{projectId:d.p}:null),
  saveUren:async(d)=>{ if(!val('fMw')||!val('fProj')||!valn('fUren')){ toast('Vul medewerker, project en aantal uren in.','bad'); return; }
    const u=Object.assign(M.id?clone(S.uren[M.id]):{}, {id:M.id, datum:val('fDatum'),uren:valn('fUren'),medewerkerId:val('fMw'),projectId:val('fProj'),soort:val('fSoort'),omschrijving:val('fOms')});
    const again=d.again; closeModal(); await save('uren',u); toast(fnum(u.uren)+' uur geschreven op '+projName(u.projectId)+'.','ok');
    if(again) editUren(null,{datum:addDays(u.datum,1),medewerkerId:u.medewerkerId,projectId:u.projectId,uren:u.uren,soort:u.soort}); },
  delUren:async(d,el)=>{ if(!armed(el)) return; const id=M.id; closeModal(); await remove('uren',id); toast('Uren verwijderd.'); },
  csvUren:()=>{ copyCSV([['Datum','Medewerker','Project','Soort','Omschrijving','Uren','Gefactureerd'], ...all('uren').sort((a,b)=>a.datum.localeCompare(b.datum)).map(u=>[u.datum,mwName(u.medewerkerId),projName(u.projectId),u.soort||'',u.omschrijving||'',+u.uren||0,u.factuurId?'ja':'nee'])],'Urenoverzicht'); },

  editWerkbon:d=>editWerkbon(d.id, d.p?{projectId:d.p}:null),
  saveWerkbon:async()=>{ if(!val('fProj')){ toast('Kies een project voor de werkbon.','bad'); return; }
    const w=M.draft; Object.assign(w,{nummer:val('fNr'),datum:val('fDatum'),status:val('fStatus'),projectId:val('fProj'),medewerkerId:val('fMw'),werkzaamheden:val('fWerk'),uren:valn('fUren'),afgetekendDoor:val('fAfg'),afgetekendOp:val('fAfgD')});
    w.materialen=w.materialen.filter(r=>r.omschrijving||+r.prijs); if(w.afgetekendDoor && w.status==='open') w.status='afgetekend';
    if(!w.id) w.id=newId();
    const linked = w.urenId && S.uren[w.urenId];
    if(w.uren>0 && w.medewerkerId && !(linked&&linked.factuurId)){ const u=Object.assign(linked?clone(linked):{}, {id:w.urenId, datum:w.datum, uren:w.uren, medewerkerId:w.medewerkerId, projectId:w.projectId, soort:'regulier', omschrijving:'Werkbon '+w.nummer, werkbonId:w.id}); w.urenId = u.id || newId(); u.id=w.urenId; closeModal(); await save('uren',u); }
    else closeModal();
    await save('werkbonnen',w); toast('Werkbon '+w.nummer+' opgeslagen.','ok'); },
  delWerkbon:async(d,el)=>{ if(!armed(el)) return; const w=S.werkbonnen[M.id]; closeModal(); if(w.urenId&&S.uren[w.urenId]&&!S.uren[w.urenId].factuurId) await remove('uren',w.urenId); await remove('werkbonnen',w.id); toast('Werkbon verwijderd.'); },

  editFactuur:d=>editFactuur(d.id),
  saveFactuur:async()=>{ const f=collectFactuur(); if(!f.relatieId){ toast('Kies een relatie voor de factuur.','bad'); return; } if(f.status==='betaald'&&!f.betaaldOp) f.betaaldOp=today();
    const uIds=f._urenIds||[], wIds=f._wbIds||[]; delete f._urenIds; delete f._wbIds; if(!f.id) f.id=newId();
    closeModal(); await save('facturen',f);
    for(const id of uIds){ const u=S.uren[id]; if(u&&!u.factuurId) await save('uren',{...clone(u),factuurId:f.id}); }
    for(const id of wIds){ const w=S.werkbonnen[id]; if(w) await save('werkbonnen',{...clone(w),status:'gefactureerd',factuurId:f.id}); }
    toast('Factuur '+f.nummer+' opgeslagen.','ok'); },
  paidFactuur:async()=>{ $('#fStatus').value='betaald'; if(!val('fBetaald')) $('#fBetaald').value=today(); await A.saveFactuur(); },
  delFactuur:async(d,el)=>{ if(!armed(el)) return; const id=M.id; closeModal();
    for(const u of all('uren').filter(u=>u.factuurId===id)){ const {factuurId,...rest}=clone(u); await save('uren',rest); }
    for(const w of all('werkbonnen').filter(w=>w.factuurId===id)){ const {factuurId,...rest}=clone(w); rest.status='afgetekend'; await save('werkbonnen',rest); }
    await remove('facturen',id); toast('Factuur verwijderd. Gekoppelde uren en werkbonnen staan weer open.'); },
  csvFacturen:()=>{ copyCSV([['Nummer','Datum','Vervaldatum','Relatie','Project','Excl. btw','Btw','Incl. btw','Btw verlegd','Status'], ...all('facturen').sort((a,b)=>String(a.nummer).localeCompare(String(b.nummer))).map(f=>{const t=totals(f.regels,f.btwVerlegd); return [f.nummer,f.datum,f.vervaldatum,relName(f.relatieId),f.projectId?projName(f.projectId):'',t.excl,t.btwTot,t.incl,f.btwVerlegd?'ja':'nee',factStatus(f)];})],'Factuuroverzicht'); },

  bkTab:d=>{ ui.bkTab=d.t; render(); },
  editBoeking:d=>editBoeking(d.id, d.p?{projectId:d.p}:null),
  saveBoeking:async()=>{ if(!val('fOms')||!valn('fBedrag')){ toast('Vul een omschrijving en bedrag in.','bad'); return; }
    const b=Object.assign(M.id?clone(S.boekingen[M.id]):{}, {id:M.id, type:val('fType'),datum:val('fDatum'),referentie:val('fRef'),omschrijving:val('fOms'),categorie:val('fCat'),relatieId:val('fRel'),projectId:val('fProj'),bedrag:valn('fBedrag'),btw:+val('fBtw'),btwVerlegd:val('fType')==='uitgave'&&checked('fBkVerlegd'),betaald:checked('fBetaald')});
    closeModal(); await save('boekingen',b); toast('Geboekt.','ok'); },
  delBoeking:async(d,el)=>{ if(!armed(el)) return; const id=M.id; closeModal(); await remove('boekingen',id); toast('Boeking verwijderd.'); },
  csvBoekingen:()=>{ copyCSV([['Datum','Soort','Grootboek','Omschrijving','Referentie','Relatie','Project','Excl. btw','Btw %','Btw verlegd','Betaald'], ...all('boekingen').sort((a,b)=>a.datum.localeCompare(b.datum)).map(b=>[b.datum,b.type,b.categorie,b.omschrijving,b.referentie||'',relName(b.relatieId),b.projectId?projName(b.projectId):'',+b.bedrag||0,String(b.btw),b.btwVerlegd?'ja':'nee',b.betaald?'ja':'nee'])],'Boekingen'); },

  saveBedrijf:async()=>{ await save('instellingen',Object.assign(clone(S.instellingen.bedrijf),{id:'bedrijf',naam:val('sNaam')||'Vervat',email:val('sMail'),adres:val('sAdres'),telefoon:val('sTel'),postcode:val('sPc'),plaats:val('sPlaats'),kvk:val('sKvk'),btw:val('sBtw'),iban:val('sIban'),betaaltermijn:valn('sTerm')||30,uurtarief:valn('sTarief')})); toast('Bedrijfsgegevens opgeslagen.','ok'); },
  editMw:d=>editMw(d.id),
  saveMw:async()=>{ if(!val('fNaam')){ toast('Vul een naam in.','bad'); return; }
    const m=Object.assign(M.id?clone(S.medewerkers[M.id]):{}, {id:M.id,naam:val('fNaam'),functie:val('fFunctie'),tarief:valn('fTarief'),kostprijs:valn('fKost'),telefoon:val('fTel'),actief:checked('fActief')});
    closeModal(); await save('medewerkers',m); toast('Medewerker opgeslagen.','ok'); },
  delMw:async(d,el)=>{ if(all('uren').some(u=>u.medewerkerId===M.id)){ toast('Deze medewerker heeft uren. Zet hem op inactief in plaats van verwijderen.','bad'); return; } if(!armed(el)) return; const id=M.id; closeModal(); await remove('medewerkers',id); },
  delExamples:async(d,el)=>{ if(!armed(el)) return; let n=0; for(const c of COLS){ for(const x of all(c).filter(x=>x.voorbeeld)){ await remove(c,x.id); n++; } } toast(n+' voorbeeldrecords verwijderd. Je administratie is leeg en klaar voor gebruik.','ok'); },
};

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.dataset.act!=='overlay') e.preventDefault();
  if(el.dataset.act==='editPlan') e.stopPropagation();
  fn(el.dataset, el, e);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ if($('#preview-root').innerHTML) $('#preview-root').innerHTML=''; else if(M!==null || $('#modal-root').innerHTML) closeModal(); }
  if(e.key==='Enter' && e.target.matches && e.target.matches('tr[data-act],div.li[data-act],div.cell[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.q!==undefined){ ui.q[el.dataset.q]=el.value; render(); return; }
  if(el.dataset.r!==undefined && M && M.draft){
    const r=M.draft[M.regelKey][+el.dataset.r]; if(!r) return; const k=el.dataset.k;
    r[k] = (k==='aantal'||k==='prijs'||k==='btw') ? (parseFloat(el.value)||0) : el.value;
    if(k==='soort'){ const eh=document.getElementById('r'+el.dataset.r+'e'); if(eh && el.value==='Arbeid'){ eh.value='uur'; r.eenheid='uur'; } }
    const t=document.getElementById('rt'+el.dataset.r); if(t) t.textContent=fmt((+r.aantal||0)*(+r.prijs||0));
    updateTotals(); return;
  }
  if(M && M.kind==='boeking' && ['fBedrag','fBtw'].includes(el.id)) bkCalc();
});
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.dataset.f!==undefined){ ui.filter[el.dataset.f]=el.value; if(el.dataset.f==='year') ui.year=+el.value; if(el.dataset.f==='btwQ') ui.btwQ=+el.value; render(); return; }
  if(!M) return;
  if(el.id==='fVerlegd') updateTotals();
  if(el.id==='fRel' && (M.kind==='offerte'||M.kind==='factuur')){ const r=byId('relaties',el.value); const c=$('#fVerlegd'); if(c&&r){ c.checked=!!r.btwVerlegd; updateTotals(); } }
  if(el.id==='fDatum' && M.kind==='factuur'){ const v=$('#fVerval'); if(v&&el.value) v.value=addDays(el.value,+bedrijf().betaaltermijn||30); }
  if(M.kind==='boeking'){
    if(el.id==='fType'){ const cats = el.value==='inkomst'?OPBR_CATS:KOSTEN_CATS; $('#fCat').innerHTML = cats.map(c=>`<option>${esc(c)}</option>`).join(''); }
    if(el.id==='fBkVerlegd') bkCalc();
  }
});
function go(v){ if(view===v) return; location.hash=v; route(); render(); window.scrollTo(0,0); }
window.addEventListener('hashchange', ()=>{ const prev=view; route(); if(prev===view) return; closeModal(); $('#preview-root').innerHTML=''; render(); window.scrollTo(0,0); });

init();
</script>
</body>
</html>
