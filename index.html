<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vervat &amp; de Jong</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vervat & de Jong BV, Breukelen. Schilders-, glaszet- en montagebedrijf sinds 1842 en al 30 jaar Weru dealer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* Layout: full-bleed photographic hero, then alternating light / dark bands with a crosshair-label column on the left and content on the right. */
:root{
  --yellow:#F9C41E;
  --yellow-dk:#E0AC00;
  --ink:#1B1B1A;
  --ink-2:#3A3A38;
  --muted:#6E6D68;
  --paper:#FAFAF7;
  --paper-2:#F3F3F0;
  --line:#D9D8D2;
  --dark:#232322;
  --white:#FFFFFF;
  --font:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --radius:18px;
  --wrap:1180px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font:400 15px/1.65 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--dark)}
a{color:inherit}
img{max-width:100%;height:auto;display:block}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance;line-height:1.08}
p{margin:0}
.y{color:var(--yellow)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- pills & buttons ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid currentColor;border-radius:99px;padding:4px 12px;font:700 11px/1.4 var(--font);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--yellow)}
.btn-ghost{display:inline-flex;align-items:center;gap:14px;border:1px solid currentColor;border-radius:99px;padding:8px 8px 8px 24px;font-weight:700;font-size:15px;text-decoration:none;background:transparent;color:inherit;transition:background .2s,color .2s}
.btn-ghost .arr{width:34px;height:34px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:var(--ink);transition:transform .25s}
.btn-ghost:hover .arr{transform:rotate(45deg)}
.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-yellow{display:inline-flex;align-items:center;justify-content:center;background:var(--yellow);color:var(--ink);border:0;border-radius:99px;padding:13px 26px;font-weight:700;text-decoration:none;transition:background .2s}
.btn-yellow:hover{background:var(--yellow-dk)}

/* ---------- header ---------- */
.hdr{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;color:var(--white);transition:background .3s,box-shadow .3s}
.hdr.solid,.hdr.scrolled{background:rgba(35,35,34,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.hdr.scrolled .hdr-in{padding-block:10px}
.hdr.solid+main{padding-top:84px}
.hdr-in{display:flex;align-items:center;gap:28px;padding-block:18px;transition:padding .3s;max-width:1400px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{flex:none;display:block;width:108px;border:1px solid rgba(255,255,255,.7)}
.logo img{width:100%;height:auto}
.nav{display:flex;gap:28px;align-items:center;flex:1;min-width:0}
.nav a,.nav button{color:var(--white);text-decoration:none;font-weight:500;font-size:15px;background:none;border:0;padding:6px 0;position:relative}
.nav a.on{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.nav a:hover,.nav button:hover{color:var(--yellow)}
.dd{position:relative}
.dd>button::after{content:"";display:inline-block;width:6px;height:6px;border:solid currentColor;border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-2px,-1px);margin-left:8px}
.dd-menu{position:absolute;top:100%;left:-18px;min-width:270px;background:var(--white);color:var(--ink);border-radius:14px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(8px);transition:.2s;display:grid}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-menu a{color:var(--ink)!important;padding:9px 12px!important;border-radius:8px;font-size:14px!important}
.dd-menu a:hover{background:var(--paper-2)}
.hdr-call{display:flex;align-items:center;gap:12px;text-decoration:none;line-height:1.2}
.hdr-call small{display:block;font-size:13px;font-weight:500}
.hdr-call b{font-size:18px;letter-spacing:.01em}
.icon-btn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.28);color:var(--white);display:grid;place-items:center;backdrop-filter:blur(6px)}
.icon-btn:hover{background:rgba(255,255,255,.4)}
.hdr-actions{display:flex;align-items:center;gap:14px}
.menu-btn{display:none}
@media (max-width:1120px){.hdr-call{display:none}}
@media (max-width:1010px){.nav{display:none}.menu-btn{display:grid}.hdr-actions{margin-left:auto}.hdr .btn-yellow{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;background:rgba(20,20,20,.5);display:flex;justify-content:flex-end}
.drawer-in{width:min(380px,100%);height:100%;overflow:auto;background:var(--dark);color:var(--white);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 24px;display:grid;align-content:start;gap:6px}
.drawer-in a{color:var(--white);text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-weight:500}
.drawer-in a.sub{padding-left:16px;font-size:14px;color:#cfcfca;font-weight:400}
.drawer-in .close{justify-self:end}
.drawer-in .contact-mini{margin-top:18px;color:#cfcfca;font-size:14px}
.drawer-in .contact-mini b{color:var(--yellow);font-size:20px;display:block}

/* search */
.search{position:fixed;inset:0;z-index:90;background:rgba(20,20,20,.88);padding:calc(80px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.search-in{max-width:720px;margin:0 auto}
.search input{width:100%;background:transparent;border:0;border-bottom:2px solid var(--yellow);color:var(--white);font:500 28px/1.3 var(--font);padding:10px 0}
.search input::placeholder{color:#9a9a95}
.search input:focus{outline:none}
.search ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:4px}
.search li a{display:block;padding:14px 16px;border-radius:10px;color:var(--white);text-decoration:none}
.search li a:hover{background:rgba(255,255,255,.08)}
.search li small{display:block;color:#a8a8a2}
.search .close{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- hero ---------- */
.hero{position:relative;color:var(--white);background:var(--dark);overflow:hidden;min-height:clamp(600px,54vw,760px);display:flex}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;display:flex}
.slide.on{opacity:1;position:relative;flex:1}
.slide .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 7s ease}
.slide.on .bg{transform:scale(1)}
.slide .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,15,.72),rgba(20,18,15,.35) 60%,rgba(20,18,15,.45)),linear-gradient(0deg,rgba(20,18,15,.5),transparent 40%)}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:28px;width:100%;max-width:1400px;margin:0 auto;padding:150px max(20px,env(safe-area-inset-right,0px)) 72px max(20px,env(safe-area-inset-left,0px))}
.hero h1{font-size:clamp(46px,7.4vw,108px);font-weight:700;letter-spacing:-.02em;line-height:1;margin:14px 0 30px;max-width:11ch}
.hero .sub{font-size:clamp(16px,1.4vw,19px);max-width:440px;margin-left:clamp(0px,10vw,148px);line-height:1.35}
.hero .btn-ghost{margin:44px 0 0 clamp(0px,10vw,148px)}
.hero-cards{display:flex;gap:24px}
.years{width:232px;height:248px;border-radius:var(--radius);padding:30px 32px;background:linear-gradient(160deg,rgba(40,36,30,.88),rgba(40,36,30,.45));backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:space-between}
.years b{font-size:42px;line-height:1.15;font-weight:700}
.years span{font-weight:500;font-size:14px;line-height:1.5}
.thumb{width:234px;height:248px;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.hero-down{position:absolute;z-index:3;left:50%;bottom:72px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:var(--white);color:var(--yellow-dk);border:0;display:grid;place-items:center}
.hero-dots{position:absolute;z-index:3;right:max(20px,env(safe-area-inset-right,0px));bottom:26px;display:flex;gap:8px}
.hero-dots button{width:28px;height:4px;border-radius:4px;border:0;background:rgba(255,255,255,.4);padding:0}
.hero-dots button.on{background:var(--yellow)}
@media (max-width:1100px){.hero-down{display:none}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;padding-top:130px;padding-bottom:64px}.hero-cards{gap:14px}.years,.thumb{width:auto;flex:1;height:170px;padding:20px}.years b{font-size:30px}.thumb{padding:0}}
@media (max-width:560px){.thumb{display:none}.years{flex:none;width:100%;height:auto;flex-direction:row;align-items:center;gap:16px}.years b br{display:none}}

/* ---------- section scaffolding ---------- */
.sec{position:relative;padding-block:clamp(70px,9vw,120px);overflow:hidden}
.sec.alt{background:var(--paper-2)}
.ghost-word{position:absolute;pointer-events:none;user-select:none;font-weight:900;line-height:.8;letter-spacing:-.03em;color:rgba(0,0,0,.035);white-space:nowrap;z-index:0}
.split{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px}
.split .lbl{position:relative;padding-top:52px}
.split .lbl::before{content:"";position:absolute;top:28px;left:48px;width:450px;height:1px;background:var(--ink)}
.split .lbl::after{content:"";position:absolute;top:0;left:300px;width:1px;height:120px;background:var(--ink)}
.split h2{font-size:clamp(36px,4.2vw,54px);margin:18px 0 26px}
.split .lead{max-width:580px;color:var(--ink-2)}
.split .lead p+p{margin-top:12px}
@media (max-width:860px){.split{grid-template-columns:1fr;gap:6px}.split .lbl{padding-top:0}.split .lbl::before,.split .lbl::after{display:none}.split h2{margin-top:6px}}

/* who we are */
.who .ghost-img{position:absolute;right:-6%;top:-4%;width:min(820px,70vw);opacity:.09;filter:invert(1) sepia(1) saturate(0);z-index:0;pointer-events:none}

/* founded */
.founded{background:var(--dark);color:var(--white);position:relative;overflow:hidden;padding-block:clamp(60px,7vw,90px)}
.founded .bgimg{position:absolute;inset:0;background:url(assets/storefront.webp) center/cover;opacity:.12;filter:grayscale(1) blur(2px)}
.founded-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center}
.founded h2{font-size:clamp(40px,4.6vw,60px);margin:22px 0 30px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 30px;list-style:none;padding:0;margin:0 0 40px;font-weight:700;font-size:14px}
.checks li{display:flex;gap:10px;align-items:flex-start}
.checks li::before{content:"";flex:none;width:12px;height:7px;border:solid var(--yellow);border-width:0 0 2.4px 2.4px;transform:rotate(-45deg);margin-top:5px}
.founded p{max-width:470px;color:#e6e5df;font-size:14.5px}
.founded .btn-ghost{margin-top:40px}
.founded .photo{border-radius:var(--radius);overflow:hidden;aspect-ratio:1.38;max-width:100%}
.founded .photo img{width:100%;height:100%;object-fit:cover}
.founded .ghost-word{color:rgba(255,255,255,.07);font-size:clamp(140px,22vw,330px);bottom:-.12em;left:20%}
@media (max-width:860px){.founded-grid{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}

/* painters */
.painters-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;margin-top:70px;align-items:start}
.painters-grid .photo{border-radius:var(--radius);overflow:hidden;aspect-ratio:1.13}
.painters-grid .photo img{width:100%;height:100%;object-fit:cover}
.svc{list-style:none;margin:0;padding:0;border-top:1px solid var(--yellow)}
.svc li{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:0;padding:20px 0;border-bottom:1px solid var(--line);min-height:76px;transition:color .2s}
.svc li span{font-size:13px;color:var(--muted);font-weight:500}
.svc li b{font-size:clamp(17px,1.5vw,20px);font-weight:500;line-height:1.25}
.svc li:hover,.svc li:first-child{color:var(--yellow-dk)}
.svc li:hover span,.svc li:first-child span{color:var(--yellow-dk)}
@media (max-width:860px){.painters-grid{grid-template-columns:1fr;margin-top:36px}}

/* floor plan */
.plan{position:relative;background:linear-gradient(var(--paper) 72%,var(--paper-2) 72%);padding-block:20px 60px;overflow:hidden}
.plan img{position:relative;z-index:1;width:min(680px,90%);margin-left:auto;margin-right:6%}
.plan .ghost-word{font-size:clamp(160px,26vw,380px);left:6%;top:18%}

/* products carousel */
.prods .ghost-img{position:absolute;right:4%;top:40px;width:min(560px,50vw);opacity:.12;z-index:0}
.carousel{position:relative;z-index:1;margin-top:56px}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px max(16px,calc((100vw - var(--wrap))/2 + 16px)) 24px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:min(375px,80vw);scroll-snap-align:start;text-decoration:none;color:var(--ink);display:block}
.card .im{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:375/440;background:var(--paper-2)}
.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .im img{transform:scale(1.05)}
.card .more{position:absolute;top:22px;left:24px;color:var(--white);border:1px solid rgba(255,255,255,.85);border-radius:99px;padding:3px 26px;font:700 11px/1.6 var(--font);letter-spacing:.05em;background:rgba(0,0,0,.12);backdrop-filter:blur(4px)}
.card h3{font-size:clamp(20px,1.8vw,24px);font-weight:700;margin-top:18px}
.card p{color:var(--muted);font-size:14px;margin-top:6px}
.card:nth-child(even){margin-top:-40px}
.car-ctrl{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.car-ctrl button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:transparent;display:grid;place-items:center;color:var(--ink)}
.car-ctrl button:hover{background:var(--yellow);border-color:var(--yellow)}
@media (max-width:700px){.card:nth-child(even){margin-top:0}}

/* use of space */
.center-head{text-align:center;position:relative;z-index:1}
.center-head h2{font-size:clamp(36px,4.2vw,54px);margin:18px 0 26px}
.center-head p{max-width:690px;margin:0 auto;color:var(--ink-2)}
.wide-img{position:relative;z-index:1;margin-top:52px;border-radius:var(--radius);overflow:hidden;aspect-ratio:2.2}
.wide-img img{width:100%;height:100%;object-fit:cover}
.center-head .btn-yellow{margin-top:26px}
@media (max-width:600px){.wide-img{aspect-ratio:1.4}}

/* long building */
.longb{position:relative;background:linear-gradient(var(--paper) 30%,var(--paper-2) 30%);padding-block:30px 0;overflow:hidden}
.longb img{position:relative;z-index:1;width:100%;filter:drop-shadow(0 34px 24px rgba(0,0,0,.22))}
.longb .ghost-word{font-size:clamp(150px,24vw,360px);left:14%;top:-30%}

/* testimonial */
.testi{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:76px;margin-top:56px;align-items:center}
.testi .photo{border-radius:var(--radius);overflow:hidden;aspect-ratio:1.4}
.testi .photo img{width:100%;height:100%;object-fit:cover}
.score{display:flex;align-items:center;gap:36px;padding-bottom:40px;border-bottom:1px solid var(--ink)}
.score b{font-size:54px;font-weight:500;line-height:1}
.stars{display:inline-flex;gap:2px;background:var(--yellow);border-radius:99px;padding:3px 9px;color:var(--white);font-size:12px;line-height:1}
.score small{display:block;margin-top:6px;font-size:14px}
.quotes{position:relative;margin-top:40px;min-height:220px}
.quote{transition:opacity .5s}
.quote blockquote{margin:0;font-size:clamp(18px,1.6vw,21px);line-height:1.5;font-weight:500}
.who-said{display:flex;align-items:center;gap:14px;margin-top:40px}
.who-said .av{width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;font-weight:700;overflow:hidden}
.who-said .av img{width:100%;height:100%;object-fit:cover}
.who-said b{display:block;font-size:17px;font-weight:500}
.who-said small{color:var(--muted);font-weight:500}
.q-nav{display:flex;gap:8px;margin-top:26px}
.q-nav button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line)}
.q-nav button.on{background:var(--yellow)}
@media (max-width:860px){.testi{grid-template-columns:1fr;gap:40px}}

/* video band */
.video{position:relative;color:var(--white);background:var(--dark);overflow:hidden;min-height:clamp(380px,46vw,620px);display:flex;align-items:flex-end}
.video .bg{position:absolute;inset:0;background:url(assets/video-still.webp) center 30%/cover}
.video .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,15,14,.8),rgba(15,15,14,.15) 70%)}
.video .play{position:absolute;z-index:2;left:50%;top:42%;transform:translate(-50%,-50%);width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.35);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--white);text-decoration:none;transition:background .2s,transform .3s}
.video .play:hover{background:var(--yellow);color:var(--ink);transform:translate(-50%,-50%) scale(1.06)}
.video h2{position:relative;z-index:2;font-size:clamp(40px,6.4vw,88px);padding-block:0 60px;max-width:13ch}
@media (max-width:600px){.video .play{width:90px;height:90px}}

/* gallery */
.gallery{position:relative;padding-block:clamp(90px,12vw,170px) 80px;overflow:hidden}
.gallery .ghost-word{font-size:clamp(140px,24vw,360px);left:50%;transform:translateX(-50%);top:40px}
.rows{position:relative;z-index:1;display:grid;gap:24px}
.row{display:flex;gap:24px;width:max-content;animation:slide 60s linear infinite;align-items:flex-end}
.row.r2{animation-direction:reverse;animation-duration:70s;align-items:flex-start}
.rows:hover .row{animation-play-state:paused}
.row figure{margin:0;border-radius:12px;overflow:hidden;flex:none}
.row img{height:100%;width:100%;object-fit:cover}
@keyframes slide{to{transform:translateX(-50%)}}

/* newsletter */
.news{position:relative;text-align:center;padding-block:40px 110px;overflow:hidden}
.news .ghost-img{position:absolute;inset:0;background:url(assets/wire-building.webp) left bottom/auto 90% no-repeat,url(assets/wire-house.webp) right bottom/auto 80% no-repeat;opacity:.2;pointer-events:none}
.news h2{position:relative;font-size:clamp(36px,4.2vw,54px);margin:20px 0 22px}
.news p{position:relative;max-width:450px;margin:0 auto;color:var(--ink-2);font-size:14px}
.news form{position:relative;display:flex;align-items:center;max-width:420px;margin:56px auto 0;border-bottom:1.5px solid var(--ink)}
.news input{flex:1;min-width:0;background:transparent;border:0;padding:12px 2px;font:400 15px var(--font);color:var(--ink)}
.news input:focus{outline:none}
.news form button{background:none;border:0;padding:8px;color:var(--ink);display:grid;place-items:center}
.news form button:hover{color:var(--yellow-dk)}
.form-msg{position:relative;margin-top:16px;font-size:14px;color:var(--ink-2);min-height:22px}
.form-msg.ok{color:#1E7A3C;font-weight:700}

/* footer */
.ftr{position:relative;background:#262624;color:var(--white);overflow:hidden}
.ftr .bg{position:absolute;inset:0;background:url(assets/hero-showroom.webp) center/cover;filter:grayscale(1);opacity:.13}
.ftr-in{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr .9fr .7fr 1.2fr;gap:40px;padding-block:100px 70px;font-size:14.5px}
.ftr .logo{border-color:rgba(255,255,255,.6);width:106px;margin-bottom:30px}
.ftr p{font-weight:500;line-height:1.55}
.ftr p+p{margin-top:18px}
.ftr h4{margin:0 0 10px;font-size:14.5px}
.ftr .hours{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-weight:400;font-variant-numeric:tabular-nums}
.ftr .hours dt,.ftr .hours dd{margin:0}
.ftr .note{font-size:12.5px;color:#bdbcb6;margin-top:12px;font-weight:400}
.ftr nav{display:grid;gap:8px;align-content:start;padding-top:28px}
.ftr nav a{text-decoration:none;font-weight:700}
.ftr nav a:hover{color:var(--yellow)}
.ftr .big a{display:block;text-decoration:none;font-weight:500;line-height:1.3}
.ftr .big .ph{color:var(--yellow);font-size:clamp(22px,2vw,27px);text-decoration:underline;text-underline-offset:4px}
.ftr .big .em{font-size:clamp(17px,1.6vw,22px);margin-top:12px;overflow-wrap:anywhere}
.ftr .soc{margin-top:60px;font-weight:700;white-space:nowrap}
.ftr .soc a{text-decoration:none}
.ftr .soc a:hover{color:var(--yellow)}
.copy{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.6);text-align:center;padding-block:28px;font-weight:500;font-size:14px}
.ftr .ghost-word{position:relative;display:block;text-align:center;color:rgba(255,255,255,.14);font-size:clamp(120px,25vw,360px);line-height:.78;margin-top:30px}
@media (max-width:960px){.ftr-in{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ftr-in{grid-template-columns:1fr;padding-block:70px 50px}.ftr nav{padding-top:0}.ftr .soc{margin-top:28px}}

/* ---------- inner pages ---------- */
.feat-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:0;margin-top:60px;border-top:1px solid var(--yellow)}
.feat{padding:30px 28px 34px 0;border-bottom:1px solid var(--line)}
.feat h3{font-size:20px;font-weight:700;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.feat h3::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--yellow);transform:translateY(-2px)}
.feat p{color:var(--ink-2);font-size:14.5px}
.duo{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;margin-top:60px}
.duo figure{margin:0;border-radius:var(--radius);overflow:hidden;aspect-ratio:1.25;background:var(--paper-2)}
.duo figure img{width:100%;height:100%;object-fit:cover}
.duo figcaption{font-size:13px;color:var(--muted);padding-top:8px}
.duo .cap{border-radius:0;overflow:visible;aspect-ratio:auto}
.duo .cap .ib{border-radius:var(--radius);overflow:hidden;aspect-ratio:1.25}
.duo .cap .ib img{width:100%;height:100%;object-fit:cover}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chips span{border:1px solid var(--line);background:var(--white);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:500}
.refs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 40px;margin-top:40px;list-style:none;padding:0}
.refs li{padding:14px 0;border-bottom:1px solid var(--line);font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.btn-line{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--ink);border-radius:99px;padding:11px 22px;font-weight:700;font-size:14px;text-decoration:none;color:var(--ink);background:transparent}
.btn-line:hover{background:var(--ink);color:var(--white)}
.cta-band{background:var(--yellow);color:var(--ink);padding-block:clamp(50px,6vw,80px)}
.cta-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center}
.cta-band h2{font-size:clamp(30px,3.4vw,44px)}
.cta-band p{margin-top:14px;max-width:520px}
.cta-hours{background:var(--ink);color:var(--white);border-radius:var(--radius);padding:28px 30px}
.cta-hours h4{margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow)}
.cta-hours dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-variant-numeric:tabular-nums;font-size:14.5px}
.cta-hours dt,.cta-hours dd{margin:0}
.cta-hours .btn-yellow{margin-top:20px}
@media (max-width:860px){.cta-in{grid-template-columns:1fr}}

.prod-list{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:40px 24px;margin-top:60px}
.prod-list .card{width:auto}
.prod-list .card:nth-child(even){margin-top:0}

.jobs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px;margin-top:56px}
.job{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:34px 32px}
.job .tag{font:700 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-dk)}
.job h3{font-size:26px;margin:12px 0 18px}
.job h4{font-size:13px;margin:18px 0 8px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.job ul{margin:0;padding-left:18px;color:var(--ink-2)}
.job li+li{margin-top:4px}

.vids{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:20px;margin-top:56px}
.vid{display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:190px;padding:26px;border-radius:var(--radius);background:var(--dark);color:var(--white);text-decoration:none;position:relative;overflow:hidden;transition:transform .25s}
.vid:hover{transform:translateY(-4px)}
.vid::before{content:"";position:absolute;inset:0;background:var(--img,url(assets/hero-showroom.webp)) center/cover;opacity:.32;transition:opacity .3s}
.vid::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,20,19,.85),rgba(20,20,19,.2))}
.vid>*{z-index:1}
.vid:hover::before{opacity:.55}
.vid>*{position:relative}
.vid .n{font-size:13px;color:var(--yellow);font-weight:700}
.vid b{font-size:19px;line-height:1.3}
.vid .pl{width:42px;height:42px;border-radius:50%;background:var(--yellow);color:var(--ink);display:grid;place-items:center}

.contact-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;margin-top:56px}
.cinfo{display:grid;gap:26px;align-content:start}
.cinfo h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cinfo .v{font-size:20px;font-weight:500;line-height:1.4;user-select:all}
.cinfo dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-variant-numeric:tabular-nums}
.cinfo dt,.cinfo dd{margin:0}
.copybtn{margin-left:8px;border:1px solid var(--line);background:var(--white);border-radius:99px;font-size:12px;padding:3px 10px;vertical-align:middle;color:var(--ink)}
.cform{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:34px;display:grid;gap:18px}
.cform label{display:grid;gap:6px;font-size:13px;font-weight:700}
.cform input,.cform select,.cform textarea{font:400 15px var(--font);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.cform textarea{min-height:130px;resize:vertical}
.cform .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cform .btn-yellow{justify-self:start}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}.cform .two{grid-template-columns:1fr}}
/* video player */
.vmodal{position:fixed;inset:0;z-index:100;background:rgba(12,12,11,.9);display:grid;place-items:center;padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vbox{width:min(1100px,100%);display:grid;gap:12px}
.vframe{position:relative;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 160px);background:#000;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#d8d7d1;font-size:14px}
.vbar a{color:#d8d7d1}
.vmodal .close{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.18)}
.preview-bar{position:fixed;z-index:90;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;font-size:13px;padding:8px 16px;border-radius:99px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}
.preview-bar a{color:var(--ink)}
.nl-msg{position:fixed;inset:0;z-index:95;background:rgba(20,20,19,.55);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.nl-card{background:var(--white);border-radius:var(--radius);padding:30px;max-width:440px;width:100%;display:grid;gap:14px;border-top:6px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.nl-card.ok{border-top-color:var(--yellow)}
.nl-card p{font-size:16px;color:var(--ink-2)}
.nl-card .btn-yellow{justify-self:start}
/* service page */
#service-form,.sform,#after-hero{scroll-margin-top:72px}
.process{position:relative;z-index:1;list-style:none;margin:60px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0;border-top:1px solid var(--yellow)}
.process li{padding:28px 26px 30px 0;border-bottom:1px solid var(--line)}
.process .num{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--yellow);font-weight:700;margin-bottom:16px}
.process h3{font-size:19px;margin-bottom:8px}
.process p{color:var(--ink-2);font-size:14.5px}
.busy{margin-top:28px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:10px;padding:16px 20px;max-width:760px;color:var(--ink-2)}
.sform{position:relative;z-index:1;margin-top:50px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(22px,4vw,44px);display:grid;gap:22px;max-width:900px}
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stepper li{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted);padding-bottom:12px;border-bottom:3px solid var(--line);min-width:0}
.stepper li span{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--paper-2);font-size:13px}
.stepper li.on{color:var(--ink);border-color:var(--yellow)}
.stepper li.on span,.stepper li.done span{background:var(--yellow);color:var(--ink)}
.stepper li.done{border-color:var(--yellow-dk)}
@media (max-width:600px){.stepper li{font-size:0;gap:0}.stepper li span{font-size:13px}}
.fstep{border:0;margin:0;padding:0;display:grid;gap:18px;min-width:0}
.fstep legend{font-size:22px;font-weight:700;margin-bottom:6px;padding:0}
.sform label{display:grid;gap:6px;font-size:13px;font-weight:700;min-width:0}
.sform input:not([type=radio]):not([type=checkbox]):not([type=file]),.sform select,.sform textarea{font:400 15px var(--font);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.sform textarea{min-height:140px;resize:vertical}
.sform .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sform .three{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px}
.sform .three .span2{grid-column:span 2}
.sform .invalid{border-color:#C0392B!important;background:#FDF3F2!important}
.radios{display:flex;flex-wrap:wrap;gap:10px}
.sform .radio{display:inline-flex;grid-auto-flow:column;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:500;font-size:14px;cursor:pointer;background:var(--paper)}
.sform .radio:has(input:checked){border-color:var(--ink);background:var(--yellow)}
.radios.invalid .radio{border-color:#C0392B}
.q{display:grid;gap:10px;font-size:13px;font-weight:700}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;cursor:pointer;background:var(--paper);justify-items:center}
.drop:hover{border-color:var(--yellow-dk)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop:focus-within{outline:3px solid var(--yellow);outline-offset:3px}
.drop b{font-size:16px}
.drop small{color:var(--muted);font-weight:400}
.files{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.files li{display:flex;justify-content:space-between;gap:10px;background:var(--paper-2);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.files li.err{background:#FDF3F2;color:#9B2C1F}
.sform .check{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:14px;line-height:1.5}
.sform .check input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--ink)}
.sform-nav{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:700px){.sform .two,.sform .three{grid-template-columns:1fr}.sform .three .span2{grid-column:auto}}
.brands{position:relative;z-index:1;list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.brands li{display:grid;place-items:center;height:84px;border:1px solid var(--line);border-radius:14px;background:var(--white);font-weight:900;font-size:22px;letter-spacing:-.01em;color:var(--ink-2)}
.svc-cards{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;margin-top:40px}
.svc-card{border:1px solid var(--line);border-radius:var(--radius);padding:34px;background:var(--white);display:grid;gap:16px;align-content:start}
.svc-card h3{font-size:24px}
.svc-card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-variant-numeric:tabular-nums;font-size:14.5px}
.svc-card dt,.svc-card dd{margin:0}
.svc-card .links{margin-top:6px}
.svc-card.dark{background:var(--dark);color:var(--white);border-color:var(--dark)}
.svc-card.dark .score{border-color:rgba(255,255,255,.4);padding-bottom:24px}
.svc-card.dark p{color:#dcdbd5}
.svc-card.dark .btn-ghost{justify-self:start}

.view{display:block}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.55);border-radius:99px;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:inherit;font:700 12px/1 var(--font);letter-spacing:.06em;padding:8px 10px;border-radius:99px}
.lang button.on{background:var(--yellow);color:var(--ink)}
.drawer-in .lang{color:var(--white)}
@media (max-width:420px){.hdr-actions{gap:8px}.hdr .icon-btn{width:40px;height:40px}}
.wa{position:fixed;z-index:70;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:#25D366;color:#fff;text-decoration:none;border-radius:99px;padding:12px 18px 12px 14px;font:700 15px/1 var(--font);box-shadow:0 10px 28px rgba(0,0,0,.28);transition:transform .2s,background .2s}
.wa:hover{background:#1EBE5A;transform:translateY(-2px)}
.wa svg{flex:none}
@media (max-width:600px){.wa{padding:14px}.wa span{display:none}}
</style>

ething new, gain access to exclusive offers, and stay informed with the latest updates in the industry. We send it at most once a month."}, "emailPh": {"nl": "E-mailadres..", "en": "Email address.."}, "subscribe": {"nl": "Aanmelden", "en": "Subscribe"}, "newsBad": {"nl": "Vul een geldig e-mailadres in, bijvoorbeeld naam@voorbeeld.nl.", "en": "Enter a valid email address, for example name@example.nl."}, "ftrVisit": {"nl": "Bezoek onze showroom, bekijk onze producten en ontvang persoonlijk deskundig advies.", "en": "Visit our showroom to discover our products and receive personalized expert advice."}, "ftrHours": {"nl": "Openingstijden showroom", "en": "Showroom opening hours"}, "ftrNote": {"nl": "Alleen op afspraak. Maandag is gereserveerd voor huisbezoeken. Telefonisch: ma–vr 7:30 – 17:00.", "en": "By appointment only. Mondays are reserved for home visits. Phone: Mon–Fri 7:30 AM – 5:00 PM."}, "rights": {"nl": "Alle rechten voorbehouden.", "en": "All rights reserved."}, "ctaTitle": {"nl": "Bezoek onze showroom in Breukelen", "en": "Visit our showroom in Breukelen"}, "ctaText": {"nl": "Bekijk de producten van dichtbij en krijg advies dat past bij uw woning. We trekken ongeveer 1,5 uur uit per bezoek, zodat er tijd is voor al uw vragen.", "en": "See the products up close and get advice that fits your home. We plan about 1.5 hours per visit, so there is time for all your questions."}, "ctaAppt": {"nl": "Afspraak maken", "en": "Make an appointment"}, "ctaHoursT": {"nl": "Showroom, op afspraak", "en": "Showroom, by appointment"}, "ctaCall": {"nl": "Bel 0346 - 261 959", "en": "Call 0346 - 261 959"}, "scroll": {"nl": "Naar de inhoud", "en": "Scroll to content"}, "prev": {"nl": "Vorige producten", "en": "Previous products"}, "next": {"nl": "Volgende producten", "en": "Next products"}, "service": {"nl": "Service", "en": "Service"}, "serviceLong": {"nl": "Reparatie &amp; onderhoud", "en": "Repair &amp; maintenance"}, "copy": {"nl": "Kopieer", "en": "Copy"}, "copied": {"nl": "Gekopieerd", "en": "Copied"}, "wa": {"nl": "Chat via WhatsApp", "en": "Chat on WhatsApp"}, "waShort": {"nl": "WhatsApp", "en": "WhatsApp"}, "waMsg": {"nl": "Hallo Vervat & de Jong, ik heb een vraag:", "en": "Hello Vervat & de Jong, I have a question:"}, "home.whoLabel": {"nl": "Wie wij zijn", "en": "Who we are"}, "home.whoTitle": {"nl": "Allround <span class=\"y\">onderhouds<\/span>­bedrijf", "en": "All-round <span class=\"y\">Maintenance<\/span><br>Company"}, "home.whoText": {"nl": "<p>Vervat &amp; de Jong BV in Breukelen is een service- en klantgericht bedrijf, in 1842 opgericht als schildersbedrijf en inmiddels uitgegroeid tot een allround onderhoudsbedrijf.<\/p><p>In de afgelopen decennia heeft het bedrijf zich ontwikkeld tot een professionele en betrouwbare onderneming met vakkundig personeel in vaste dienst. Oorspronkelijk opgericht als Fa. C. Vervat &amp; Zn, werkt het bedrijf al jaren samen met De Jong Schilderwerken om de continuïteit te waarborgen.<\/p>", "en": "<p>Vervat &amp; de Jong BV in Breukelen is a service- and customer-oriented company, founded in 1842 as a painting company, and has since grown into an all-round maintenance company.<\/p><p>Over the past decades, the company has developed into a professional and reliable enterprise with skilled permanent staff. Originally founded as Fa. C. Vervat &amp; Zn, the company has been working with de Jong Schilderwerken for years to ensure continuity.<\/p>"}, "home.foundedLabel": {"nl": "Opgericht in 1842", "en": "Founded in 1842"}, "home.foundedTitle": {"nl": "Vervat <span class=\"y\">&amp;<\/span><br>de Jong BV", "en": "Vervat <span class=\"y\">&amp;<\/span><br>de Jong BV"}, "home.foundedText": {"nl": "Ons vakkundige personeel bestaat uit schilders, glaszetters en kunststof kozijnmonteurs, allemaal in vaste dienst. Ze werken als team en hebben hart voor hun vak. Dat zie je terug in zeer tevreden klanten; referenties zijn beschikbaar.", "en": "Our skilled staff consists of painters, glaziers, and uPVC window frame fitters, all permanent employees who work together as a team and are passionate about their work. This translates into highly satisfied customers, and references are available."}, "home.rateUs": {"nl": "Beoordeel ons", "en": "Rate us"}, "home.paintersLabel": {"nl": "Schilders", "en": "Painters"}, "home.paintersTitle": {"nl": "Onze <span class=\"y\">schilders<\/span>", "en": "Our <span class=\"y\">Painters<\/span>"}, "home.paintersText": {"nl": "<p>Dankzij onze vakkundige schilders in vaste dienst zijn we gespecialiseerd in duurzaam onderhoud en afwerking. We stellen daarom hoge eisen aan onze dienstverlening. Opdrachtgevers kunnen kiezen uit de volgende categorieën, of een combinatie daarvan:<\/p>", "en": "<p>Thanks to our skilled painters on permanent staff, we specialize in sustainable maintenance and finishing. We therefore set high standards for our services. Clients can choose from the following categories or combinations thereof:<\/p>"}, "home.productsTitle": {"nl": "Onze producten <span class=\"y\">bepalen<\/span><br><span class=\"y\">onze<\/span> stijl", "en": "Our Products <span class=\"y\">That<\/span><br><span class=\"y\">Define<\/span> Our Style"}, "home.productsText": {"nl": "<p>Onze producten en diensten laten het vakmanschap zien van onze schilders, glaszetters en kozijnmonteurs. Hun teamwork en passie zorgen voor blijvende kwaliteit en tevreden klanten.<\/p>", "en": "<p>Our products and services reflect the craftsmanship of our skilled painters, glaziers, and uPVC window frame fitters, whose teamwork and passion deliver lasting quality and customer satisfaction.<\/p>"}, "home.spaceLabel": {"nl": "Ruimtegebruik", "en": "Use of space"}, "home.spaceTitle": {"nl": "Optimaal benutten <span class=\"y\">van ruimte<\/span>", "en": "Optimal Use <span class=\"y\">Of Space<\/span>"}, "home.spaceText": {"nl": "Steeds meer mensen hebben een garage aan huis. Logisch, want het is een relatief goedkope en snelle manier om extra woon- en/of werkruimte te creëren. Een standaard garagedeur voldoet dan niet meer. De Aluport kan een goede oplossing zijn: deze geïsoleerde pui sluit de garage af op de plek waar eerst de garagedeur zat. Interesse in een geïsoleerde Aluport? Profiteer nu.", "en": "More and more people are adding garages to their homes. This isn't surprising, as it's a relatively inexpensive and quick way to create more living and/or work space. A standard garage door is no longer sufficient. The Aluport could be a good solution. This insulated doorway closes off the garage where the garage door used to be. Interested in an insulated Aluport? Take advantage now."}, "home.clientsLabel": {"nl": "Wat klanten zeggen", "en": "Our clients say"}, "home.clientsTitle": {"nl": "Dit zijn de <span class=\"y\">warme woorden<\/span><br>van <span class=\"y\">onze klanten<\/span>", "en": "Here’s What <span class=\"y\">Warm Words<\/span><br><span class=\"y\">Our Clients<\/span> Say"}, "home.reviews": {"nl": "beoordelingen", "en": "reviews"}, "home.galleryWord": {"nl": "galerij", "en": "gallery"}, "products.text": {"nl": "<p>Van Weru ramen en deuren tot schilderwerk, glaszetten en gevelbekleding: alles voor het onderhoud en de verbetering van uw woning, bij één bedrijf in Breukelen.<\/p>", "en": "<p>From Weru windows and doors to painting, glazing and facade cladding: everything for the maintenance and improvement of your home, from one company in Breukelen.<\/p>"}, "product.refsLabel": {"nl": "Referenties", "en": "References"}, "product.refsTitle": {"nl": "Een selectie <span class=\"y\">projecten<\/span>", "en": "Selected <span class=\"y\">projects<\/span>"}, "product.refsText": {"nl": "<p>Een volledige referentielijst is op aanvraag beschikbaar.<\/p>", "en": "<p>A full reference list is available on request.<\/p>"}, "product.moreLabel": {"nl": "Meer producten", "en": "More products"}, "product.moreTitle": {"nl": "Ontdek <span class=\"y\">meer<\/span>", "en": "Explore <span class=\"y\">more<\/span>"}, "about.kicker": {"nl": "Opgericht in 1842", "en": "Founded in 1842"}, "about.sub": {"nl": "Schilders-, glaszet- en montagebedrijf<br>een begrip in de regio", "en": "Painting, glazing and installation company<br>a household name in the region"}, "about.title": {"nl": "Allround <span class=\"y\">onderhouds<\/span>­bedrijf", "en": "All-round <span class=\"y\">Maintenance<\/span><br>Company"}, "about.text": {"nl": "<p>Vervat &amp; de Jong BV in Breukelen werd in 1842 opgericht als schildersbedrijf en is uitgegroeid tot een allround onderhoudsbedrijf. Oorspronkelijk opgericht als Fa. C. Vervat &amp; Zn, werkt het bedrijf al jaren samen met De Jong Schilderwerken om de continuïteit te waarborgen. Het bedrijf wordt geleid door Cees Vervat en Erik de Jong.<\/p><p>Ons team bestaat uit schilders, glaszetters en kunststof kozijnmonteurs. Allemaal in vaste dienst, werkend als team en met hart voor het bedrijf. Dat zie je terug in zeer tevreden klanten; referenties zijn op aanvraag beschikbaar.<\/p>", "en": "<p>Vervat &amp; de Jong BV in Breukelen was founded in 1842 as a painting company and has grown into an all-round maintenance company. Originally founded as Fa. C. Vervat &amp; Zn, the company has worked with de Jong Schilderwerken for years to ensure continuity. Today it is run by Cees Vervat and Erik de Jong.<\/p><p>Our team consists of painters, glaziers and uPVC window frame fitters. All of them are permanent employees who work together as a team and care about the company. That shows in very satisfied customers, and references are available on request.<\/p>"}, "about.caption1": {"nl": "Erik de Jong &amp; Cees Vervat", "en": "Erik de Jong &amp; Cees Vervat"}, "about.caption2": {"nl": "Schilders, glaszetters en kozijnmonteurs, allemaal in vaste dienst", "en": "Painters, glaziers and frame fitters, all permanent staff"}, "vac.kicker": {"nl": "Werken bij ons", "en": "Work with us"}, "vac.sub": {"nl": "Kom werken in een solide, dynamisch team van schilders, glaszetters en kozijnmonteurs in Breukelen", "en": "Join a solid, dynamic team of painters, glaziers and frame fitters in Breukelen"}, "vac.btn": {"nl": "Solliciteer per e-mail", "en": "Apply by email"}, "vac.title": {"nl": "Kom bij <span class=\"y\">ons werken<\/span>", "en": "Come and <span class=\"y\">work with us<\/span>"}, "vac.text": {"nl": "<p>Stuur je sollicitatie naar <b>info@vervat-breukelen.nl<\/b> of bel Erik de Jong op <b>0346 - 261 959<\/b>.<\/p>", "en": "<p>Send your application to <b>info@vervat-breukelen.nl<\/b> or call Erik de Jong on <b>0346 - 261 959<\/b>.<\/p>"}, "show.sub": {"nl": "Korte films over de vragen die we in onze showroom het vaakst horen", "en": "Short films that answer the questions we hear most in our showroom"}, "show.btn": {"nl": "Plan een echt bezoek", "en": "Book a real visit"}, "show.title": {"nl": "Tien vragen, <span class=\"y\">tien films<\/span>", "en": "Ten questions, <span class=\"y\">ten films<\/span>"}, "show.text": {"nl": "<p>Bekijk ze thuis en kom daarna naar onze showroom in Breukelen voor persoonlijk advies.<\/p>", "en": "<p>Watch at home, then come to our showroom in Breukelen for personal advice.<\/p>"}, "svc.kicker": {"nl": "Klantenservice", "en": "Customer service"}, "svc.sub": {"nl": "Onderhoud, reparatie en garantie efficiënt geregeld", "en": "Maintenance, repairs and warranty claims, handled efficiently"}, "svc.btn": {"nl": "Service aanvragen", "en": "Request service"}, "svc.title": {"nl": "Efficiënt regelen van <span class=\"y\">onderhoud, reparatie<\/span> en garantie", "en": "Efficiently arrange <span class=\"y\">maintenance, repairs<\/span> and warranty"}, "svc.text": {"nl": "<p>Heeft u een vraag over onderhoud of een reparatie aan uw kozijnen, deuren, schuifpui, garagedeur, dakkapel of ander product? Wij helpen u graag, zowel binnen als buiten de garantieperiode.<\/p><p>Meld uw verzoek aan via het formulier hieronder. Na verzending ontvangt u een bevestiging.<\/p>", "en": "<p>Do you have a question about maintenance or a repair to your window frames, doors, sliding door, garage door, dormer or other product? We are happy to help, both within and after the warranty period.<\/p><p>Submit your request with the form below. You will receive a confirmation once it is sent.<\/p>"}, "svc.busy": {"nl": "Let op: in drukke periodes kan de serviceplanning drie tot vier weken vooruit lopen. Bij spoed? Bel ons op <b>0346 - 261 959<\/b>.", "en": "Please note: in busy periods the service schedule can run three to four weeks ahead. Urgent? Call us on <b>0346 - 261 959<\/b>."}, "svc.formLabel": {"nl": "Serviceverzoek", "en": "Service request"}, "svc.formTitle": {"nl": "Meld uw <span class=\"y\">serviceverzoek<\/span> aan", "en": "Submit your <span class=\"y\">service request<\/span>"}, "svc.formText": {"nl": "<p>Drie korte stappen. Velden met * zijn verplicht.<\/p>", "en": "<p>Three short steps. Fields marked * are required.<\/p>"}, "svc.brandsLabel": {"nl": "Merken", "en": "Brands"}, "svc.brandsTitle": {"nl": "Service op de merken <span class=\"y\">die wij leveren<\/span>", "en": "Service on the brands <span class=\"y\">we supply<\/span>"}, "svc.reviewsTitle": {"nl": "Klantervaringen", "en": "Customer experiences"}, "svc.reviewsText": {"nl": "Lees wat klanten over onze service zeggen, of laat zelf een beoordeling achter.", "en": "Read what customers say about our service, or leave a review yourself."}, "svc.reviewsBtn": {"nl": "Bekijk beoordelingen", "en": "Read reviews"}, "contact.title": {"nl": "Maak een <span class=\"y\">afspraak<\/span>", "en": "Make an <span class=\"y\">appointment<\/span>"}, "contact.text": {"nl": "<p>Onze showroom is open op afspraak. Vertel ons wat u van plan bent, dan nemen we contact met u op om een tijd af te spreken.<\/p>", "en": "<p>Our showroom is open by appointment. Tell us what you are planning and we will get back to you to set a time.<\/p>"}, "form.sent": {"nl": "Bedankt! We hebben uw bericht ontvangen en nemen zo snel mogelijk contact met u op.", "en": "Thank you! We have received your message and will get back to you as soon as possible."}, "form.sending": {"nl": "Bezig met verzenden…", "en": "Sending…"}, "form.failed": {"nl": "Verzenden is niet gelukt. Probeer het opnieuw, of mail naar <b>info@vervat-breukelen.nl<\/b> / bel 0346 - 261 959.", "en": "Sending failed. Please try again, or email <b>info@vervat-breukelen.nl<\/b> / call 0346 - 261 959."}, "form.offline": {"nl": "Dit formulier is nog niet gekoppeld. Mail uw bericht naar <b>info@vervat-breukelen.nl<\/b> of bel 0346 - 261 959.", "en": "This form is not connected yet. Please email your message to <b>info@vervat-breukelen.nl<\/b> or call 0346 - 261 959."}, "news.sent": {"nl": "Bijna klaar! We hebben u een e-mail gestuurd. Klik op de link in die e-mail om uw aanmelding te bevestigen.", "en": "Almost done! We have sent you an email. Click the link in it to confirm your subscription."}, "news.already": {"nl": "U bent al aangemeld voor de nieuwsbrief. Bedankt!", "en": "You are already subscribed to the newsletter. Thank you!"}, "news.working": {"nl": "Een moment…", "en": "One moment…"}, "news.confirmed": {"nl": "Gelukt! U bent aangemeld voor de nieuwsbrief van Vervat &amp; de Jong.", "en": "Done! You are now subscribed to the Vervat &amp; de Jong newsletter."}, "news.unsubscribed": {"nl": "U bent afgemeld. U ontvangt de nieuwsbrief niet meer.", "en": "You have been unsubscribed. You will no longer receive the newsletter."}, "news.badlink": {"nl": "Deze link werkt niet (meer). Neem contact met ons op als u zich wilt aan- of afmelden.", "en": "This link does not work (any more). Please contact us if you want to subscribe or unsubscribe."}}}</script>
<script>
/* =========================================================
   Vervat & de Jong website
   All editable content lives in content.json (edited through /admin/).
   ========================================================= */
let LANG='nl';
try{const s=localStorage.getItem('vdj-lang');if(s==='en'||s==='nl')LANG=s;}catch(_){}
const L=v=>(v&&typeof v==='object'&&!Array.isArray(v)&&('nl' in v))?(v[LANG]??v.nl):v;

let C,T,PRODUCTS,byId;
const P=p=>Object.assign({},p,p[LANG]);
const A=n=>!n?'':/^https?:|^data:/.test(n)?n:/\.[a-z0-9]{3,4}$/i.test(n)?`assets/${n}`:`assets/${n}.webp`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const X=k=>L(T[k])??'';

const WA_ICON='<svg width="26" height="26" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6z"/><path d="M21.9 18.8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.8 5.1 2.2.9 3 1 4.1.8.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>';
const waLink=()=>`https://wa.me/${C.site.whatsapp}?text=${encodeURIComponent(X('waMsg'))}`;
const ARROW='<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3.5 10.5l7-7M4.5 3.5h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLAY='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const PLAYS='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const DOWN='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 2v11M3.5 8.5 8 13l4.5-4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const XICON='<svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 3 10 10M13 3 3 13"/></svg>';
const tel=()=>C.site.phoneIntl, phone=()=>C.site.phone, mail=()=>C.site.email;

/* ================= SHARED TEMPLATES ================= */
function langSwitch(){
  return `<div class="lang" role="group" aria-label="Taal / Language">${['nl','en'].map(l=>`<button type="button" data-lang="${l}" class="${l===LANG?'on':''}" aria-pressed="${l===LANG}">${l.toUpperCase()}</button>`).join('')}</div>`;
}
function headerHTML(){
  return `<div class="hdr-in">
   <a class="logo" href="#home" aria-label="Vervat &amp; de Jong, home"><img src="assets/logo.webp" alt="Vervat &amp; de Jong bv" width="640" height="223"></a>
   <nav class="nav" aria-label="Main">
    <a href="#home" data-nav="home">${X('home')}</a>
    <div class="dd"><button type="button" aria-haspopup="true" onclick="location.hash='products'">${X('products')}</button>
     <div class="dd-menu">${PRODUCTS.map(p=>`<a href="#${p.id}">${P(p).short}</a>`).join('')}</div></div>
    <a href="#about" data-nav="about">${X('about')}</a>
    <a href="#vacancies" data-nav="vacancies">${X('vacancies')}</a>
    <a href="#showroom" data-nav="showroom">${X('showroom')}</a>
    <a href="#service" data-nav="service">${X('service')}</a>
   </nav>
   <div class="hdr-actions">
    <a class="hdr-call" href="tel:${tel()}"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8.5 3.5 6 3c-1 .2-2.6 1.6-2.4 3.4.6 6 6.4 12 13.5 14 1.6.4 3-1 3.3-2l-.4-2.6-3.7-1.4-1.6 1.6c-2.2-1-4.4-3.2-5.4-5.4l1.6-1.6L9.5 5.3z"/><path d="M15 3.5v2.3M19.6 5.4 18 7M21.5 10h-2.3" stroke-linecap="round"/></svg>
     <span><small>${X('callUs')}</small><b>${phone()}</b></span></a>
    ${langSwitch()}
    <a class="btn-yellow" href="#contact">${X('contactBtn')}</a>
    <button class="icon-btn" type="button" data-act="search" aria-label="${esc(X('search'))}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg></button>
    <button class="icon-btn" type="button" data-act="menu" aria-label="${esc(X('menu'))}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/></svg></button>
   </div></div>`;
}
function hoursDl(skipMon){return (C.site.hours[LANG]||[]).filter(r=>!(skipMon&&/^(ma|mon)/i.test(r[0]))).map(([d,h])=>`<dt>${d}</dt><dd>${h}</dd>`).join('')}
function shellHTML(){
  const s=C.site;
  return `<section class="news" aria-labelledby="newsTitle"><div class="ghost-img" aria-hidden="true"></div><div class="wrap">
    <span class="pill">${X('newsPill')}</span><h2 id="newsTitle">${X('newsTitle')}</h2><p>${X('newsText')}</p>
    <form id="newsForm" novalidate><label for="newsEmail" style="position:absolute;left:-9999px">E-mail</label>
     <input id="newsEmail" type="email" placeholder="${esc(X('emailPh'))}" autocomplete="email" required>
     <button type="submit" aria-label="${esc(X('subscribe'))}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
    <div class="form-msg" id="newsMsg" role="status"></div></div></section>
  <footer class="ftr"><div class="bg" aria-hidden="true"></div><div class="wrap ftr-in">
    <div><a class="logo" href="#home"><img src="assets/logo.webp" alt="Vervat &amp; de Jong bv" width="640" height="223"></a>
     <p>${X('ftrVisit')}</p><p>${s.address.join('<br>')}</p></div>
    <div><h4>${X('ftrHours')}</h4><dl class="hours">${hoursDl(true)}</dl><p class="note">${X('ftrNote')}</p></div>
    <nav aria-label="Footer"><a href="#home">${X('home')}</a><a href="#products">${X('products')}</a><a href="#about">${X('about')}</a><a href="#vacancies">${X('vacancies')}</a><a href="#showroom">${X('showroom')}</a><a href="#service">${X('serviceLong')}</a><a href="#contact">${X('contact')}</a><a href="administratie/" target="_blank" rel="noopener">${X('adminDemo')||'Administratie (demo)'}</a></nav>
    <div class="big"><a class="ph" href="tel:${tel()}">${phone()}</a><a class="em" href="mailto:${mail()}">${mail()}</a>
     <div class="soc"><a href="${s.facebook}" target="_blank" rel="noopener">Facebook</a> &nbsp;-&nbsp; <a href="${s.instagram}" target="_blank" rel="noopener">Instagram</a></div></div>
   </div>
   <div class="copy wrap">© Copyright ${new Date().getFullYear()} <span class="y">Vervat &amp; de Jong</span>. ${X('rights')}</div>
   <span class="ghost-word" aria-hidden="true">Vervat</span></footer>
  <a class="wa" href="${waLink()}" target="_blank" rel="noopener" aria-label="${esc(X('wa'))}">${WA_ICON}<span>${X('waShort')}</span></a>`;
}
function drawerHTML(){
  return `<div class="drawer-in" role="dialog" aria-label="Menu">
   <div style="display:flex;justify-content:space-between;align-items:center">${langSwitch()}<button class="icon-btn close" type="button" data-act="close" aria-label="${esc(X('close'))}" style="background:rgba(255,255,255,.12)">${XICON}</button></div>
   <a href="#home">${X('home')}</a><a href="#products">${X('products')}</a>
   ${PRODUCTS.map(p=>`<a class="sub" href="#${p.id}">${P(p).short}</a>`).join('')}
   <a href="#about">${X('about')}</a><a href="#vacancies">${X('vacancies')}</a><a href="#showroom">${X('showroom')}</a><a href="#service">${X('serviceLong')}</a><a href="#contact">${X('contact')}</a>
   <div class="contact-mini">${X('callUs')}<b>${phone()}</b>${mail()}<br>${C.site.address.slice(1).join(', ')}</div></div>`;
}
function searchHTML(){
  return `<button class="icon-btn close" type="button" data-act="close" aria-label="${esc(X('close'))}">${XICON}</button>
   <div class="search-in"><label for="q" style="position:absolute;left:-9999px">${X('search')}</label>
   <input id="q" type="search" placeholder="${esc(X('searchPh'))}" autocomplete="off"><ul id="results"></ul></div>`;
}

/* ================= PAGE TEMPLATES ================= */
function hero(slides){
  return `<section class="hero" id="hero" aria-roledescription="carousel">
   ${slides.map((s,i)=>`<div class="slide${i?'':' on'}" aria-hidden="${i?'true':'false'}">
     <div class="bg" style="background-image:url('${A(s.bg)}')"></div>
     <div class="hero-grid"><div>
       <span class="pill">${L(s.kicker)||X('fast')}</span>
       <h1>${L(s.title)}</h1><p class="sub">${L(s.sub)}</p>

/* ================= FORM SENDING ================= */
const fileToB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
async function sendForm(type,data,files){
  const url=C.site.formEndpoint;if(!url)return 'offline';
  try{
    const fl=[];for(const f of (files||[]).slice(0,3))fl.push({name:f.name,type:f.type||'application/octet-stream',data:await fileToB64(f)});
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type,lang:LANG,page:location.href,...data,files:fl})});
    const j=await r.json();sendForm.last=j;return j&&j.ok?'sent':'failed';
  }catch(e){return 'failed'}
}
function showResult(el,res){el.innerHTML=res==='sent'?X('form.sent'):res==='offline'?X('form.offline'):X('form.failed');el.classList.toggle('ok',res==='sent')}

const view=document.getElementById('view'),hdr=document.getElementById('hdr'),shell=document.getElementById('shell'),drawer=document.getElementById('drawer'),search=document.getElementById('search');
let timer=null;
const TITLES={service:'serviceLong',products:'products',about:'about',vacancies:'vacancies',showroom:'showroom',contact:'contact'};
function renderChrome(){
  document.documentElement.lang=LANG;
  hdr.innerHTML=headerHTML();shell.innerHTML=shellHTML();drawer.innerHTML=drawerHTML();search.innerHTML=searchHTML();
  document.getElementById('q').addEventListener('input',doSearch);
  const nf=document.getElementById('newsForm');
  nf.addEventListener('submit',async e=>{e.preventDefault();const em=document.getElementById('newsEmail'),m=document.getElementById('newsMsg');
    if(!em.value||!em.checkValidity()){m.textContent=X('newsBad');return}
    m.textContent=X('form.sending');const r=await sendForm('newsletter',{email:em.value,name:'',phone:'',fields:{}});
    if(r==='sent'){m.textContent=X((sendForm.last||{}).status==='already'?'news.already':'news.sent');m.classList.add('ok');nf.reset()}else showResult(m,r);});
}
function render(keepScroll){
  const h=(location.hash||'#home').slice(1);
  clearInterval(timer);
  let html,key=h;
  if(h==='service-form'){html=VIEWS.service();key='service';}
  else if(byId[h]) html=VIEWS.product(byId[h]);
  else if(VIEWS[h]&&h!=='product') html=VIEWS[h]();
  else {html=VIEWS.home();key='home';}
  view.innerHTML=html;
  hdr.classList.toggle('solid',!view.querySelector('.hero'));
  hdr.querySelectorAll('.nav [data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===key));
  const t=byId[h]?P(byId[h]).short:(TITLES[key]?X(TITLES[key]).replace('&amp;','&'):'');
  document.title=(t?t+' | ':'')+'Vervat & de Jong';
  if(!keepScroll)window.scrollTo(0,0);
  initHero();initCarousel();initForms();initService();initQuotes();
  if(h==='service-form'){const t=document.getElementById('service-form');if(t)setTimeout(()=>t.scrollIntoView(),50)}
}
function setLang(l){if(l===LANG)return;LANG=l;try{localStorage.setItem('vdj-lang',l)}catch(_){}
  renderChrome();render(true);}
function initHero(){
  const slides=[...view.querySelectorAll('.slide')];if(slides.length<2)return;
  const dots=[...view.querySelectorAll('.hero-dots button')];let i=0;
  const go=n=>{slides[i].classList.remove('on');slides[i].setAttribute('aria-hidden','true');dots[i].classList.remove('on');i=(n+slides.length)%slides.length;slides[i].classList.add('on');slides[i].setAttribute('aria-hidden','false');dots[i].classList.add('on')};
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const restart=()=>{clearInterval(timer);if(!reduce)timer=setInterval(()=>go(i+1),6500)};
  dots.forEach(d=>d.onclick=()=>{go(+d.dataset.i);restart()});
  restart();
}
function initQuotes(){
  const qs=[...view.querySelectorAll('.quote')],dots=[...view.querySelectorAll('.q-nav button')];if(qs.length<2)return;
  dots.forEach(d=>d.onclick=()=>{qs.forEach((q,k)=>q.hidden=k!==+d.dataset.q);dots.forEach(x=>x.classList.toggle('on',x===d))});
}
function initCarousel(){
  const tr=view.querySelector('#track');if(!tr)return;
  view.querySelectorAll('.car-ctrl button').forEach(b=>b.onclick=()=>tr.scrollBy({left:(+b.dataset.dir)*(tr.querySelector('.card').offsetWidth+24),behavior:'smooth'}));
}
function initService(){
  const f=view.querySelector('#sform');if(!f)return;const nl=LANG==='nl';
  const steps=[...f.querySelectorAll('.fstep')],marks=[...f.querySelectorAll('.stepper li')];
  const prev=f.querySelector('#sPrev'),next=f.querySelector('#sNext'),send=f.querySelector('#sSend'),msg=f.querySelector('#sMsg');let cur=0;
  const show=i=>{cur=i;steps.forEach((s,k)=>s.hidden=k!==i);marks.forEach((m,k)=>{m.classList.toggle('on',k===i);m.classList.toggle('done',k<i)});prev.hidden=i===0;next.hidden=i===steps.length-1;send.hidden=i!==steps.length-1;msg.textContent=''};
  const valid=i=>{let ok=true;const st=steps[i];
    st.querySelectorAll('input:not([type=radio]):not([type=file]),select,textarea').forEach(el=>{const bad=!el.checkValidity();el.classList.toggle('invalid',bad&&el.type!=='checkbox');if(bad)ok=false});
    st.querySelectorAll('.radios').forEach(g=>{const r=g.querySelector('input[required]');if(r){const bad=!g.querySelector('input:checked');g.classList.toggle('invalid',bad);if(bad)ok=false}});
    if(!ok){msg.textContent=nl?'Vul de gemarkeerde velden in om verder te gaan.':'Please complete the highlighted fields to continue.';const first=st.querySelector('.invalid input,.invalid,:invalid');if(first&&first.focus)first.focus()}
    return ok};
  f.addEventListener('input',e=>{e.target.classList&&e.target.classList.remove('invalid');const g=e.target.closest('.radios');if(g)g.classList.remove('invalid')});
  next.onclick=()=>{if(valid(cur)){show(cur+1);f.scrollIntoView({block:'start'})}};
  prev.onclick=()=>{show(cur-1);f.scrollIntoView({block:'start'})};
  const fi=f.querySelector('#sFiles'),fl=f.querySelector('#sFileList');let filesOk=true;
  fi.onchange=()=>{const fs=[...fi.files];filesOk=true;
    fl.innerHTML=fs.map((x,k)=>{const big=x.size>5*1024*1024,ty=!/\.(jpe?g|png|pdf)$/i.test(x.name),many=k>=3;const err=big||ty||many;if(err)filesOk=false;
      const why=many?(nl?'max. 3 bestanden':'max. 3 files'):big?(nl?'groter dan 5 MB':'larger than 5 MB'):ty?(nl?'alleen JPG, PNG of PDF':'JPG, PNG or PDF only'):(x.size/1048576).toFixed(1)+' MB';
      return `<li class="${err?'err':''}"><span>${esc(x.name)}</span><span>${why}</span></li>`}).join('')};
  const v=id=>(f.querySelector('#'+id)||{}).value||'';const r=n=>(f.querySelector(`input[name=${n}]:checked`)||{}).value||'';
  f.addEventListener('submit',async e=>{e.preventDefault();if(!valid(cur))return;
    if(!filesOk){msg.textContent=nl?'Verwijder of vervang de bestanden met een foutmelding.':'Remove or replace the files marked with an error.';return}
    send.disabled=true;msg.textContent=X('form.sending');
    const res=await sendForm('service',{name:[r('sSal'),v('sInit'),v('sInfix'),v('sLast')].filter(Boolean).join(' '),email:v('sEmail'),phone:v('sPhone'),
      fields:{company:v('sCompany'),street:v('sStreet'),postcode:v('sZip'),city:v('sCity'),product:v('sProd'),year:v('sYear'),suppliedByUs:r('sDeliv'),description:v('sDesc')}},[...fi.files]);
    send.disabled=false;showResult(msg,res);
    if(res==='sent'){f.reset();fl.innerHTML='';setTimeout(()=>show(0),4000)}});
  show(0);
}
function initForms(){
  const cf=view.querySelector('#cform');
  if(cf)cf.addEventListener('submit',async e=>{e.preventDefault();const out=view.querySelector('#cMsgOut');const nl=LANG==='nl';
    if(!cf.checkValidity()){out.textContent=nl?'Vul uw naam, een geldig e-mailadres en een bericht in.':'Please fill in your name, a valid email address and a message.';return}
    const btn=cf.querySelector('button[type=submit]');btn.disabled=true;out.textContent=X('form.sending');
    const g=id=>cf.querySelector('#'+id).value;
    const res=await sendForm('contact',{name:g('cName'),email:g('cEmail'),phone:g('cPhone'),fields:{subject:g('cTopic'),message:g('cMsg')}});
    btn.disabled=false;showResult(out,res);if(res==='sent')cf.reset();});
  view.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const v=b.dataset.copy;
    const done=()=>{b.textContent=X('copied');setTimeout(()=>b.textContent=X('copy'),1500)};
    try{navigator.clipboard.writeText(v).then(done,()=>sel(b))}catch(_){sel(b)}});
  function sel(b){const r=document.createRange();r.selectNodeContents(b.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r)}
}
function doSearch(){
  const nl=LANG==='nl';
  const idx=[...PRODUCTS.map(r=>{const p=P(r);return {h:p.id,t:p.short,d:p.sub,k:[p.name,p.sub,...p.lead,...p.feats.flat(),r.nl.name,r.en.name].join(' ')}}),
   {h:'about',t:X('about'),d:nl?'Opgericht in 1842 in Breukelen':'Founded in 1842 in Breukelen',k:'history geschiedenis team 1842 vervat de jong'},
   {h:'vacancies',t:X('vacancies'),d:nl?'Vacatures en stages':'Jobs and internships',k:'jobs werk schilder painter timmerman carpenter stage internship'},
   {h:'showroom',t:X('showroom'),d:nl?'Korte films':'Short films',k:'video films showroom'},
   {h:'service',t:X('serviceLong').replace('&amp;','&'),d:nl?'Serviceverzoek, garantie en reparaties':'Service requests, warranty and repairs',k:'service reparatie repair onderhoud maintenance garantie warranty storing defect klacht'},
   {h:'contact',t:X('contact'),d:C.site.address.slice(1).join(', ')+' · '+phone(),k:'telefoon phone email adres address openingstijden hours afspraak appointment'}];
  const v=document.getElementById('q').value.trim().toLowerCase();
  const hits=idx.filter(x=>!v||(x.t+' '+x.k).toLowerCase().includes(v));
  document.getElementById('results').innerHTML=hits.length?hits.map(x=>`<li><a href="#${x.h}">${x.t}<small>${x.d}</small></a></li>`).join(''):`<li style="color:#bbb;padding:14px 16px">${X('noRes')}</li>`;
}
document.addEventListener('click',e=>{
  const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
  const act=e.target.closest('[data-act]');
  if(act){const a=act.dataset.act;
    if(a==='menu')drawer.hidden=false;
    else if(a==='search'){search.hidden=false;const q=document.getElementById('q');q.value='';doSearch();q.focus()}
    else if(a==='close'){drawer.hidden=true;search.hidden=true}
    return}
  if(e.target===drawer||(e.target.closest('a')&&(drawer.contains(e.target)||search.contains(e.target)))){drawer.hidden=true;search.hidden=true}
});
/* in-page video player */
const vmodal=document.getElementById('vmodal'),vframe=document.getElementById('vframe');let vReturn=null;
function videoFrom(href){let m=href.match(/youtube\.com\/watch\?v=([\w-]{6,})/)||href.match(/youtu\.be\/([\w-]{6,})/)||href.match(/youtube\.com\/(?:embed|shorts)\/([\w-]{6,})/);
  if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
  m=href.match(/vimeo\.com\/(?:video\/)?(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1]+'?autoplay=1&dnt=1';return null}
function openVideo(a){const src=videoFrom(a.href);if(!src)return false;const nl=LANG==='nl';vReturn=a;
  vframe.innerHTML='<iframe src="'+src+'" title="Video" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>';
  const t=((a.querySelector('b')||{}).textContent||a.getAttribute('aria-label')||a.textContent||'').trim();document.getElementById('vtitle').textContent=t.length>2&&t.length<90?t:'';
  const ext=document.getElementById('vext');ext.href=a.href;ext.textContent=a.href.includes('vimeo')?(nl?'Open op Vimeo':'Open on Vimeo'):(nl?'Open op YouTube':'Open on YouTube');
  document.getElementById('vclose').setAttribute('aria-label',nl?'Video sluiten':'Close video');
  vmodal.hidden=false;document.body.style.overflow='hidden';document.getElementById('vclose').focus();return true}
function closeVideo(){if(vmodal.hidden)return;vmodal.hidden=true;vframe.innerHTML='';document.body.style.overflow='';if(vReturn&&vReturn.focus)vReturn.focus()}
document.getElementById('vclose').onclick=closeVideo;
vmodal.addEventListener('click',e=>{if(e.target===vmodal)closeVideo()});
document.addEventListener('click',e=>{if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey)return;const a=e.target.closest('a[href]');
  if(a&&!vmodal.contains(a)&&openVideo(a)){e.preventDefault();e.stopPropagation()}},true);
addEventListener('keydown',e=>{if(e.key==='Escape'){search.hidden=true;drawer.hidden=true;closeVideo()}});
const onScroll=()=>hdr.classList.toggle('scrolled',scrollY>40);
addEventListener('scroll',onScroll,{passive:true});

/* ================= NEWSLETTER LINKS (confirm / unsubscribe) ================= */
async function newsletterLink(){
  const q=new URLSearchParams(location.search);const a=q.get('nl');if(a!=='confirm'&&a!=='unsub')return;
  const box=document.createElement('div');box.className='nl-msg';box.setAttribute('role','dialog');box.setAttribute('aria-live','polite');
  const show=(k,ok)=>{box.innerHTML=`<div class="nl-card ${ok?'ok':''}"><b>Vervat &amp; de Jong</b><p>${X(k)}</p><button type="button" class="btn-yellow">OK</button></div>`;box.querySelector('button').onclick=()=>box.remove()};
  show('news.working',false);document.body.appendChild(box);
  history.replaceState(null,'',location.pathname+location.hash);
  if(!C.site.formEndpoint){show('news.badlink',false);return}
  try{const u=new URL(C.site.formEndpoint);u.searchParams.set('action',a);u.searchParams.set('e',q.get('e')||'');u.searchParams.set('t',q.get('t')||'');
    const j=await (await fetch(u.toString())).json();
    show(j.ok?(a==='confirm'?'news.confirmed':'news.unsubscribed'):'news.badlink',j.ok);
  }catch(_){show('news.badlink',false)}
}

/* ================= BOOT ================= */
function useContent(c){C=c;T=C.texts;PRODUCTS=C.products;byId=Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));}
async function boot(){
  let draft=null;
  if(/[?&]preview=1/.test(location.search)){try{const d=JSON.parse(localStorage.getItem('vdj-admin-draft')||'null');if(d&&d.content)draft=d.content}catch(_){}}
  if(draft){useContent(draft);const bar=document.createElement('div');bar.className='preview-bar';bar.innerHTML='Voorbeeld van niet-gepubliceerde wijzigingen · <a href="./">Bekijk live versie</a>';document.body.appendChild(bar);}
  else{try{const r=await fetch('content.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;useContent(await r.json());}
  catch(_){useContent(JSON.parse(document.getElementById('content-fallback').textContent));}}
  renderChrome();render();onScroll();
  newsletterLink();
  addEventListener('hashchange',()=>{render();onScroll()});
}
boot();
</script>
